<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Artikel — Mandala Channel</title>
<link rel="stylesheet" href="../css/main.css">
<style>
:root{--navy:#082d56;--navy-deep:#061f3c;--ink:#1b2a3a;--muted:#6f7e8d;--paper:#f7f6f1;--white:#fff;--line:#e2e7eb;--bronze:#a9823f;--page-pad:clamp(18px,4vw,72px);}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:90px}body{margin:0;overflow-x:hidden;background:#fff;color:var(--ink)}img{max-width:100%;display:block}a{text-decoration:none;color:inherit}button{font:inherit}.w{width:100%;max-width:none;margin:0;padding-inline:var(--page-pad)}
.top{height:28px;background:var(--navy-deep);color:#dbe5ef;font-size:clamp(8px,.55vw,11px)}.top .w{height:100%;display:flex;align-items:center;justify-content:space-between;padding-inline:clamp(10px,2vw,34px)}
header#siteHeader{position:sticky;top:0;z-index:1000;height:78px;background:rgba(255,255,255,.97);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(8,45,86,.08);transition:height .28s ease,box-shadow .28s ease,background .28s ease}header#siteHeader.scrolled{height:62px;background:rgba(255,255,255,.94);box-shadow:0 7px 24px rgba(6,31,60,.10)}.nav{height:100%;display:flex;align-items:center;justify-content:space-between;gap:clamp(16px,2vw,36px)}.logo{display:flex;align-items:center;gap:12px;flex:0 0 auto}.mark{width:42px;height:42px;border:1px solid var(--bronze);border-radius:50%;display:grid;place-items:center;color:var(--bronze);font-size:18px}.logo b{display:block;color:var(--navy);font:500 clamp(16px,1.15vw,22px)/1 Georgia,serif;letter-spacing:.15em}.logo small{display:block;color:#8794a0;font-size:clamp(7px,.5vw,9px);letter-spacing:.28em;margin-top:2px}.links{display:flex;align-items:center;gap:clamp(16px,1.9vw,32px);margin-left:auto}.links a{position:relative;padding:28px 0;font-size:clamp(9px,.62vw,12px);white-space:nowrap;color:#526170;text-transform:uppercase}.links a:after{content:"";position:absolute;left:0;right:0;bottom:16px;height:2px;background:var(--bronze);transform:scaleX(0);transition:transform .22s ease}.links a:hover,.links a[aria-current="page"]{color:var(--navy)}.links a:hover:after,.links a[aria-current="page"]:after{transform:scaleX(1)}header.scrolled .links a{padding:20px 0}header.scrolled .links a:after{bottom:11px}.yt{background:var(--navy);color:#fff;padding:10px 14px;border-radius:4px;font-size:clamp(8px,.55vw,10px);font-weight:700;white-space:nowrap}
.breadcrumb{padding:clamp(22px,2.5vw,38px) 0;border-bottom:1px solid var(--line);font-size:clamp(10px,.65vw,12px);color:#7b8894}.breadcrumb a{color:var(--navy)}.breadcrumb span{margin:0 9px;color:#b0bac2}
.articleHero{padding:clamp(42px,5.5vw,84px) 0 clamp(34px,4vw,58px);background:linear-gradient(115deg,#f5f7f9 0%,#fff 58%,#f2f5f7 100%)}.articleHead{max-width:1100px;margin:0 auto}.k{color:var(--bronze);font-size:clamp(10px,.68vw,12px);letter-spacing:.18em;text-transform:uppercase;font-weight:800}.articleHead h1{margin:14px 0 18px;color:var(--navy);font:500 clamp(40px,5vw,76px)/1.02 Georgia,serif;letter-spacing:-.025em}.lead{max-width:850px;margin:0;color:#667586;font-size:clamp(14px,1vw,18px);line-height:1.75}.metaRow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:24px;color:#7a8794;font-size:clamp(10px,.66vw,12px)}.metaDot{width:4px;height:4px;border-radius:50%;background:#b8c1c9}.share{margin-left:auto;display:flex;gap:8px}.share button{border:1px solid #dbe1e6;background:#fff;color:var(--navy);padding:8px 11px;border-radius:3px;cursor:pointer;font-size:11px}
.coverWrap{padding:0 0 clamp(38px,5vw,76px);background:#fff}.cover{width:min(100%,1380px);margin:0 auto;padding-inline:var(--page-pad)}.cover figure{margin:0;overflow:hidden;border-radius:5px;background:#e9eef2}.cover img{width:100%;aspect-ratio:21/10;object-fit:cover}.cover figcaption{padding:10px 0 0;color:#84909a;font-size:clamp(9px,.58vw,11px)}
.articleLayout{padding:clamp(10px,2vw,30px) 0 clamp(65px,8vw,120px)}.articleGrid{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,.28fr);gap:clamp(36px,7vw,100px)}.content{min-width:0}.content>*{max-width:780px}.content p{margin:0 0 1.45em;color:#38495a;font-size:clamp(16px,1.08vw,19px);line-height:1.9}.content h2{margin:2.2em 0 .7em;color:var(--navy);font:500 clamp(28px,2.5vw,40px)/1.12 Georgia,serif}.content h3{margin:2em 0 .7em;color:var(--navy);font:600 clamp(21px,1.7vw,29px)/1.2 Georgia,serif}.content blockquote{margin:2em 0;padding:clamp(20px,2.5vw,34px);border-left:3px solid var(--bronze);background:#faf9f6;color:var(--navy);font:500 clamp(22px,2vw,32px)/1.35 Georgia,serif}.content img{margin:2em 0;border-radius:4px}.articleAside{align-self:start;position:sticky;top:94px;border-top:1px solid var(--line);padding-top:20px}.asideTitle{color:var(--bronze);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;margin-bottom:16px}.author{padding-bottom:20px;border-bottom:1px solid var(--line)}.author strong{display:block;color:var(--navy);font:500 20px Georgia,serif;margin-bottom:6px}.author span{color:#7a8794;font-size:12px}.asideLinks{display:grid;gap:10px;margin-top:20px}.asideLinks a{color:#506171;font-size:12px}.asideLinks a:hover{color:var(--navy)}
.related{padding:clamp(55px,7vw,100px) 0;background:var(--paper);border-top:1px solid #ece9e2}.sectionHead{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:clamp(22px,3vw,38px)}.sectionHead h2{margin:6px 0 0;color:var(--navy);font:500 clamp(30px,3vw,48px)/1.05 Georgia,serif}.backAll{color:var(--bronze);font-size:clamp(10px,.65vw,12px);font-weight:700}.relatedGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,2vw,30px)}.relatedCard{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;transition:transform .25s ease,box-shadow .25s ease}.relatedCard:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(6,31,60,.09)}.relatedCard img{width:100%;aspect-ratio:16/9;object-fit:cover}.relatedCopy{padding:18px}.relatedCopy .k{font-size:9px}.relatedCopy h3{margin:8px 0 7px;color:var(--navy);font:500 clamp(18px,1.35vw,24px)/1.18 Georgia,serif}.relatedCopy p{margin:0;color:#778492;font-size:12px;line-height:1.55}
.notFound{max-width:760px;margin:clamp(70px,10vw,140px) auto;text-align:center;padding:40px;border:1px dashed #ccd5dd}.notFound h1{color:var(--navy);font:500 42px Georgia,serif}.notFound p{color:#6f7e8d;line-height:1.7}.notFound a{display:inline-block;margin-top:15px;background:var(--navy);color:#fff;padding:11px 16px;border-radius:4px;font-size:12px}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .65s ease,transform .65s ease}.reveal.visible{opacity:1;transform:none}footer{background:var(--navy-deep);color:#b9c5d0;padding:28px 0;text-align:center;font-size:10px}
@media(max-width:860px){.articleGrid{grid-template-columns:1fr}.articleAside{position:static;display:grid;grid-template-columns:1fr 1fr;gap:30px}.share{margin-left:0}.relatedGrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.links{display:none}.cover{padding-inline:var(--page-pad)}.cover img{aspect-ratio:16/10}.articleHead h1{font-size:clamp(38px,11vw,58px)}.articleAside{grid-template-columns:1fr}.top{display:none}header#siteHeader{height:66px}header#siteHeader.scrolled{height:58px}.mark{width:36px;height:36px}.relatedGrid{grid-template-columns:1fr}}
@media(max-width:560px){:root{--page-pad:14px}.articleHero{padding-top:42px}.breadcrumb{padding:16px 0}.lead{font-size:14px}.content p{font-size:16px;line-height:1.82}.metaRow{gap:8px}.share{width:100%}}
</style>
</head>
<body data-base="../">
<div class="top"><div class="w"><span>MANDALA CHANNEL · MEDIA DHARMA &amp; NUSANTARA</span><span>Instagram · YouTube · Kontak</span></div></div>
<header id="siteHeader"><div class="w nav">
<a class="logo" href="../index.html"><div class="mark">✺</div><div><b>MANDALA</b><small>CHANNEL</small></div></a>
<nav class="links" aria-label="Navigasi utama"><a href="../index.html">Beranda</a><a href="artikel.html" aria-current="page">Artikel</a><a href="video.html">Video</a><a href="playlist.html">Playlist</a><a href="podcast.html">Podcast</a><a href="tentang-kami.html">Tentang</a></nav>
<a class="yt" href="https://www.youtube.com/" target="_blank" rel="noopener">YOUTUBE ↗</a>
</div></header>
<main id="app"><div class="notFound"><h1>Memuat artikel…</h1><p>Mohon tunggu sebentar.</p></div></main>
<footer><div class="w">© 2026 Mandala Channel</div></footer>
<script>
(function(){'use strict';
const BASE=document.body.dataset.base||'../'; const app=document.querySelector('#app');
const header=document.querySelector('#siteHeader'); const updateHeader=()=>header.classList.toggle('scrolled',window.scrollY>20); updateHeader(); window.addEventListener('scroll',updateHeader,{passive:true});
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params=new URLSearchParams(location.search); const slug=params.get('slug')||'';
function plain(v){return String(v??'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim()}
function contentHtml(article){
  const raw=article.content||article.body||article.text||article.description||article.excerpt||'';
  if(!raw) return `<p>Artikel ini sudah memiliki judul, kategori, tanggal dan gambar utama. Isi lengkapnya nantinya dapat ditambahkan atau diperbarui oleh admin dari sistem pengelolaan konten.</p>`;
  if(/<\/?[a-z][\s\S]*>/i.test(raw)) return raw;
  return raw.split(/\n\s*\n/).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join('');
}
function dateValue(a){return a.date||a.publishedAt||a.createdAt||''}
function authorValue(a){return a.author||a.writer||'Redaksi Mandala'}
function render(article,all){
 document.title=`${article.title||'Artikel'} — Mandala Channel`;
 const related=all.filter(a=>a.slug!==article.slug&&a.category===article.category).slice(0,3);
 app.innerHTML=`
 <div class="breadcrumb"><div class="w"><a href="../index.html">Beranda</a><span>/</span><a href="artikel.html">Artikel</a><span>/</span><b>${esc(article.category||'Artikel')}</b></div></div>
 <article>
 <section class="articleHero"><div class="w articleHead reveal"><div class="k">${esc(article.category||'Artikel')}</div><h1>${esc(article.title||'Tanpa judul')}</h1><p class="lead">${esc(article.excerpt||article.summary||plain(article.description||'Menelusuri cerita, wawasan dan perjalanan Nusantara melalui perspektif Mandala Channel.'))}</p><div class="metaRow"><span>${esc(dateValue(article))}</span><span class="metaDot"></span><span>${esc(authorValue(article))}</span><span class="metaDot"></span><span>Mandala Channel</span><div class="share"><button id="copyLink">Salin tautan</button><button id="shareBtn">Bagikan</button></div></div></div></section>
 <section class="coverWrap"><div class="cover reveal"><figure><img src="${esc(article.image||'')}" alt="${esc(article.title||'')}" loading="eager"><figcaption>${esc(article.caption||'Dokumentasi Mandala Channel')}</figcaption></figure></div></section>
 <section class="articleLayout"><div class="w"><div class="articleGrid"><div class="content reveal" id="articleContent">${contentHtml(article)}</div><aside class="articleAside reveal"><div class="author"><div class="asideTitle">Penulis</div><strong>${esc(authorValue(article))}</strong><span>Redaksi Mandala Channel</span></div><div><div class="asideTitle">Jelajahi</div><div class="asideLinks"><a href="artikel.html">← Kembali ke semua artikel</a><a href="../index.html">Beranda Mandala</a><a href="playlist.html">Playlist pilihan</a></div></div></aside></div></div></section>
 </article>
 <section class="related"><div class="w"><div class="sectionHead"><div><div class="k">Baca berikutnya</div><h2>Artikel terkait</h2></div><a class="backAll" href="artikel.html">Semua artikel →</a></div><div class="relatedGrid">${related.length?related.map(a=>`<a class="relatedCard reveal" href="artikel-detail.html?slug=${encodeURIComponent(a.slug||'')}"><img src="${esc(a.image||'')}" alt="${esc(a.title||'')}"><div class="relatedCopy"><div class="k">${esc(a.category||'Artikel')}</div><h3>${esc(a.title||'Tanpa judul')}</h3><p>${esc(dateValue(a))} · Baca artikel →</p></div></a>`).join(''):`<div class="notFound" style="grid-column:1/-1;margin:0"><h1 style="font-size:30px">Belum ada artikel terkait</h1><p>Artikel lain akan muncul otomatis ketika admin menambahkan data.</p></div>`}</div></div></section>`;
 document.querySelector('#copyLink').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(location.href);document.querySelector('#copyLink').textContent='Tautan disalin';setTimeout(()=>document.querySelector('#copyLink').textContent='Salin tautan',1800)}catch(e){prompt('Salin tautan ini:',location.href)}});
 document.querySelector('#shareBtn').addEventListener('click',async()=>{if(navigator.share){try{await navigator.share({title:article.title,text:article.excerpt||'',url:location.href})}catch(e){}}else document.querySelector('#copyLink').click()});
 requestAnimationFrame(()=>{const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target)}}),{threshold:.06});document.querySelectorAll('.reveal').forEach(el=>io.observe(el));});
}
async function init(){try{const r=await fetch(BASE+'data/articles.json',{cache:'no-store'});if(!r.ok)throw new Error();const all=await r.json();const article=all.find(a=>String(a.slug||'')===slug)||all[0];if(!article)throw new Error('empty');render(article,all)}catch(e){app.innerHTML=`<div class="notFound"><h1>Artikel tidak ditemukan</h1><p>Artikel belum tersedia atau tautannya tidak lagi aktif.</p><a href="artikel.html">Kembali ke Artikel</a></div>`}}
init();
})();
</script>
</body>
</html>
