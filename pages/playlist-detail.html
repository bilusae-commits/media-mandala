<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Playlist Detail — Mandala</title><link rel="stylesheet" href="../css/main.css"></head><body data-base="../"><header><div class="w nav"><a class="logo" href="../index.html"><div class="mark">✺</div><div><b>MANDALA</b><small>CHANNEL</small></div></a></div></header><section class="page"><div class="w"><div class="k">Mandala Playlist</div><h1 id="ptitle">Playlist</h1><p id="pdesc"></p></div></section><section><div class="w"><div class="featureGrid"><article class="feature"><img id="pimg"><div class="copy"><div class="k" id="pcat"></div><h2 id="phead"></h2><small id="pcount"></small></div></article><div class="story"><div class="copy"><div class="k">YOUTUBE</div><h3>Putar serial di dalam Mandala</h3><p>Playlist ID akan diisi melalui data/CMS. Player tetap berada di website.</p><button class="btn primary" onclick="playList()">▶ PUTAR PLAYLIST</button></div></div></div></div></section><div class="modal" id="modal"><div class="modalBox"><div class="modalBar"><span id="modalTitle"></span><button class="close" onclick="closeVideo()">×</button></div><div class="frame"><iframe id="videoFrame" allowfullscreen></iframe></div></div></div><footer><div class="w"><div class="copy">© 2026 Mandala Channel</div></div></footer><script src="../js/main.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{await loadData();let id=new URLSearchParams(location.search).get('id')||'1';window.currentPlaylist=DATA.playlists.find(x=>String(x.id)===id)||DATA.playlists[0];ptitle.textContent=currentPlaylist.title;phead.textContent=currentPlaylist.title;pcat.textContent=currentPlaylist.category;pcount.textContent=currentPlaylist.videoCount+' video';pdesc.textContent='Kumpulan video Mandala Channel dalam serial '+currentPlaylist.title;pimg.src='../assets/images/playlists/playlist-'+String(currentPlaylist.id).padStart(2,'0')+'.jpg'});function playList(){if(!currentPlaylist.youtubePlaylistId){alert('Playlist ID belum diisi. Nanti karyawan cukup memasukkan URL Playlist YouTube melalui CMS.');return}}</script></body></html>
