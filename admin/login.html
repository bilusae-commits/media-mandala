<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login — Mandala Channel</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --navy: #071b33;
            --navy-light: #0d2949;
            --gold: #b9975b;
            --white: #ffffff;
            --text: #152033;
            --muted: #718096;
            --border: #e5e9ef;
            --bg: #f5f7fa;
            --danger: #c0392b;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: "DM Sans", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .login-page {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
        }

        .brand-panel {
            position: relative;
            overflow: hidden;
            background:
                linear-gradient(
                    135deg,
                    rgba(7, 27, 51, 0.98),
                    rgba(13, 41, 73, 0.96)
                );
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
        }

        .brand-panel::before {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 50%;
            top: -220px;
            right: -150px;
        }

        .brand-panel::after {
            content: "";
            position: absolute;
            width: 650px;
            height: 650px;
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 50%;
            bottom: -350px;
            left: -220px;
        }

        .brand-content {
            position: relative;
            z-index: 2;
            max-width: 540px;
        }

        .brand-label {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--gold);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        .brand-label::before {
            content: "";
            width: 32px;
            height: 1px;
            background: var(--gold);
        }

        .brand-title {
            font-family: "Playfair Display", serif;
            font-size: clamp(42px, 5vw, 72px);
            line-height: 1;
            margin: 0 0 25px;
            font-weight: 600;
        }

        .brand-description {
            font-size: 17px;
            line-height: 1.8;
            color: rgba(255,255,255,0.7);
            max-width: 460px;
            margin: 0;
        }

        .login-panel {
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
        }

        .mobile-logo {
            display: none;
        }

        .login-heading {
            margin-bottom: 35px;
        }

        .login-heading h1 {
            margin: 0 0 10px;
            font-family: "Playfair Display", serif;
            font-size: 38px;
            color: var(--navy);
        }

        .login-heading p {
            margin: 0;
            color: var(--muted);
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
        }

        .form-group input {
            width: 100%;
            height: 52px;
            padding: 0 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #fff;
            color: var(--text);
            font: inherit;
            outline: none;
            transition: 0.2s ease;
        }

        .form-group input:focus {
            border-color: var(--navy);
            box-shadow: 0 0 0 3px rgba(7,27,51,0.08);
        }

        .password-wrap {
            position: relative;
        }

        .password-wrap input {
            padding-right: 80px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            font: inherit;
            font-size: 12px;
            font-weight: 700;
        }

        .login-button {
            width: 100%;
            height: 54px;
            margin-top: 8px;
            border: 0;
            border-radius: 8px;
            background: var(--navy);
            color: white;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .login-button:hover {
            background: var(--navy-light);
            transform: translateY(-1px);
        }

        .login-button:disabled {
            opacity: 0.65;
            cursor: wait;
            transform: none;
        }

        .error-message {
            display: none;
            margin-bottom: 18px;
            padding: 13px 15px;
            border-radius: 7px;
            background: #fff3f2;
            border: 1px solid #f2c9c5;
            color: var(--danger);
            font-size: 13px;
            line-height: 1.5;
        }

        .back-link {
            display: block;
            margin-top: 28px;
            text-align: center;
            color: var(--muted);
            text-decoration: none;
            font-size: 13px;
        }

        .back-link:hover {
            color: var(--navy);
        }

        @media (max-width: 800px) {
            .login-page {
                grid-template-columns: 1fr;
            }

            .brand-panel {
                display: none;
            }

            .login-panel {
                min-height: 100vh;
                padding: 30px 22px;
            }

            .mobile-logo {
                display: block;
                margin-bottom: 55px;
                text-align: center;
            }

            .mobile-logo strong {
                font-family: "Playfair Display", serif;
                color: var(--navy);
                font-size: 30px;
            }

            .mobile-logo span {
                display: block;
                margin-top: 5px;
                color: var(--gold);
                font-size: 10px;
                font-weight: 700;
                letter-spacing: 0.18em;
                text-transform: uppercase;
            }
        }
    </style>
</head>

<body>

<div class="login-page">

    <section class="brand-panel">
        <div class="brand-content">
            <div class="brand-label">
                Mandala Channel
            </div>

            <h1 class="brand-title">
                Ruang Redaksi
                Mandala
            </h1>

            <p class="brand-description">
                Kelola artikel, video, playlist, podcast, dan berbagai
                konten Mandala Channel melalui satu ruang kerja yang
                terintegrasi.
            </p>
        </div>
    </section>

    <section class="login-panel">

        <div class="login-box">

            <div class="mobile-logo">
                <strong>Mandala</strong>
                <span>Channel</span>
            </div>

            <div class="login-heading">
                <h1>Selamat datang.</h1>
                <p>
                    Masuk menggunakan akun redaksi Mandala Channel.
                </p>
            </div>

            <div
                id="errorMessage"
                class="error-message"
                role="alert"
            ></div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        placeholder="nama@email.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrap">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            autocomplete="current-password"
                            placeholder="Masukkan password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            id="togglePassword"
                        >
                            Tampilkan
                        </button>
                    </div>
                </div>

                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    Masuk ke Dashboard
                </button>

            </form>

            <a
                href="../index.html"
                class="back-link"
            >
                ← Kembali ke Mandala Channel
            </a>

        </div>

    </section>

</div>

<script type="module">
    import { supabase } from "./js/auth.js";

    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const errorBox = document.getElementById("errorMessage");

    function showError(message) {
        errorBox.textContent = message;
        errorBox.style.display = "block";
    }

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        errorBox.style.display = "none";

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        button.disabled = true;
        button.textContent = "Memeriksa...";

        try {

            const { data, error } =
                await supabase.auth.signInWithPassword({
                    email,
                    password
                });

            if (error) {
                console.error(error);

                showError(
                    error.message ||
                    "Email atau password salah."
                );

                button.disabled = false;
                button.textContent = "Masuk ke Dashboard";

                return;
            }

            if (!data?.user) {
                showError("Login tidak menghasilkan user.");

                button.disabled = false;
                button.textContent = "Masuk ke Dashboard";

                return;
            }

            /*
             * Login berhasil.
             * Jangan cek profile di sini.
             * Langsung masuk dashboard.
             */
            window.location.href = "./index.html";

        } catch (error) {

            console.error(error);

            showError(
                "Terjadi kesalahan saat login. Silakan coba lagi."
            );

            button.disabled = false;
            button.textContent = "Masuk ke Dashboard";
        }
    });
</script>

</body>
</html>
