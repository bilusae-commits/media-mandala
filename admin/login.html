<!doctype html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login Admin — Mandala Channel</title><style>:root{--navy:#071b33;--gold:#b9975b;--text:#172033;--muted:#718096;--border:#e3e7ed;--bg:#f4f6f9}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:25px;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.login-wrapper{width:100%;max-width:430px}.brand{text-align:center;margin-bottom:28px}.brand img{display:block;width:190px;max-width:100%;height:auto;margin:0 auto 10px}.brand-subtitle{color:var(--gold);font-size:9px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}.login-card{padding:34px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 20px 50px rgba(7,27,51,.08)}h1{margin:0;color:var(--navy);font-size:26px}.description{margin:8px 0 27px;color:var(--muted);font-size:11px;line-height:1.6}.message{display:none;margin-bottom:18px;padding:12px 13px;border-radius:7px;font-size:11px;line-height:1.55}.message.error{border:1px solid #edcfcb;background:#fff5f4;color:#b43b32}.message.success{border:1px solid #c9e5d7;background:#f2fbf6;color:#237a51}.field{margin-bottom:17px}.field label{display:block;margin-bottom:7px;font-size:11px;font-weight:700}.field input{width:100%;height:45px;padding:0 13px;border:1px solid var(--border);border-radius:7px;outline:none;background:#fff;font-size:12px}.field input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(7,27,51,.06)}button{width:100%;height:46px;margin-top:7px;border:0;border-radius:7px;background:var(--navy);color:#fff;font-size:12px;font-weight:700;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.back{margin-top:20px;text-align:center}.back a{color:var(--muted);font-size:10px;text-decoration:none}@media(max-width:500px){body{padding:17px}.login-card{padding:26px 22px}.brand img{width:165px}}</style></head>
<body><div class="login-wrapper"><div class="brand"><img src="../assets/brand/Asset%205@4x.png" alt="Mandala Channel"><div class="brand-subtitle">Channel Administration</div></div><div class="login-card"><h1>Masuk ke Dashboard</h1><p class="description">Gunakan akun administrator atau editor untuk mengelola konten Mandala Channel.</p><div id="message" class="message"></div><form id="loginForm"><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="Masukkan email" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Masukkan password" required></div><button id="loginButton" type="submit">Masuk ke Dashboard</button></form><div class="back"><a href="../index.html">← Kembali ke website</a></div></div></div>
<script src="../js/config.js?v=20260824.5"></script><script src="../js/supabase-client.js?v=20260824.5"></script><script>
const form=document.getElementById('loginForm'),email=document.getElementById('email'),password=document.getElementById('password'),button=document.getElementById('loginButton'),message=document.getElementById('message');
function show(text,type='error'){message.textContent=text;message.className='message '+type;message.style.display='block'}
form.addEventListener('submit',async e=>{e.preventDefault();message.style.display='none';button.disabled=true;button.textContent='Memeriksa...';try{const result=await window.MandalaSupabase.auth.signIn(email.value.trim(),password.value);if(!result?.user)throw new Error('Login gagal. User tidak ditemukan.');if(!result.profile)throw new Error('Login berhasil, tetapi profile pengguna tidak ditemukan.');if(!['admin','editor'].includes(result.profile.role)){await window.MandalaSupabase.auth.signOut();throw new Error('Akun Anda belum memiliki role admin atau editor.')}show('Login berhasil. Membuka dashboard...','success');button.textContent='Berhasil';setTimeout(()=>location.replace('./dashboard.html?v=20260824.5'),300)}catch(err){console.error('Mandala Login Error:',err);show(err?.message||'Login gagal.');button.disabled=false;button.textContent='Masuk ke Dashboard'}});
</script></body></html>
