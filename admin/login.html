<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Admin — Mandala Channel</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --navy: #071b33;
            --gold: #b9975b;
            --text: #172033;
            --muted: #718096;
            --border: #e3e7ed;
            --bg: #f4f6f9;
            --danger: #b43b32;
            --success: #237a51;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: "DM Sans", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 430px;
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-title {
            color: var(--navy);
            font-family: "Playfair Display", serif;
            font-size: 38px;
            font-weight: 600;
            line-height: 1;
        }

        .brand-subtitle {
            margin-top: 9px;
            color: var(--gold);
            font-size: 9px;
            font-weight: 700;
            letter-spacing: .2em;
            text-transform: uppercase;
        }

        .login-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 34px;
            box-shadow:
                0 20px 50px rgba(7, 27, 51, .08);
        }

        .login-card h1 {
            margin: 0;
            color: var(--navy);
            font-family: "Playfair Display", serif;
            font-size: 26px;
            font-weight: 600;
        }

        .login-card-description {
            margin: 8px 0 27px;
            color: var(--muted);
            font-size: 11px;
            line-height: 1.6;
        }

        .field {
            margin-bottom: 17px;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            color: var(--text);
            font-size: 11px;
            font-weight: 700;
        }

        .field input {
            width: 100%;
            height: 45px;
            padding: 0 13px;
            border: 1px solid var(--border);
            border-radius: 7px;
            outline: none;
            background: #fff;
            color: var(--text);
            font-size: 12px;
            transition: border-color .18s ease;
        }

        .field input:focus {
            border-color: var(--navy);
        }

        .login-button {
            width: 100%;
            height: 46px;
            margin-top: 7px;
            border: 0;
            border-radius: 7px;
            background: var(--navy);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: .18s ease;
        }

        .login-button:hover {
            background: #0d2949;
        }

        .login-button:disabled {
            opacity: .65;
            cursor: wait;
        }

        .message {
            display: none;
            margin-bottom: 18px;
            padding: 12px 13px;
            border-radius: 7px;
            font-size: 11px;
            line-height: 1.55;
        }

        .message.error {
            border: 1px solid #edcfcb;
            background: #fff5f4;
            color: var(--danger);
        }

        .message.success {
            border: 1px solid #c9e5d7;
            background: #f2fbf6;
            color: var(--success);
        }

        .back {
            margin-top: 20px;
            text-align: center;
        }

        .back a {
            color: var(--muted);
            font-size: 10px;
            text-decoration: none;
        }

        .back a:hover {
            color: var(--navy);
        }

        @media (max-width: 500px) {

            body {
                padding: 17px;
            }

            .login-card {
                padding: 26px 22px;
            }

            .brand-title {
                font-size: 34px;
            }
        }
    </style>
</head>

<body>

<div class="login-wrapper">

    <div class="brand">
        <div class="brand-title">
            Mandala
        </div>

        <div class="brand-subtitle">
            Channel Administration
        </div>
    </div>


    <div class="login-card">

        <h1>
            Masuk ke Dashboard
        </h1>

        <p class="login-card-description">
            Gunakan akun administrator atau editor
            untuk mengelola konten Mandala Channel.
        </p>


        <div
            id="message"
            class="message"
        ></div>


        <form id="loginForm">

            <div class="field">

                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    autocomplete="email"
                    placeholder="Masukkan email"
                    required
                >

            </div>


            <div class="field">

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Masukkan password"
                    required
                >

            </div>


            <button
                id="loginButton"
                class="login-button"
                type="submit"
            >
                Masuk ke Dashboard
            </button>

        </form>


        <div class="back">

            <a href="../index.html">
                ← Kembali ke website
            </a>

        </div>

    </div>

</div>


<script type="module">

    import { supabase }
        from "../js/supabase-client.js";


    const form =
        document.getElementById("loginForm");

    const emailInput =
        document.getElementById("email");

    const passwordInput =
        document.getElementById("password");

    const button =
        document.getElementById("loginButton");

    const message =
        document.getElementById("message");


    function showMessage(
        text,
        type = "error"
    ) {

        message.textContent = text;

        message.className =
            `message ${type}`;

        message.style.display =
            "block";
    }


    form.addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();


            const email =
                emailInput.value.trim();

            const password =
                passwordInput.value;


            if (!email || !password) {

                showMessage(
                    "Email dan password wajib diisi."
                );

                return;
            }


            button.disabled =
                true;

            button.textContent =
                "Memeriksa...";

            message.style.display =
                "none";


            try {

                const {
                    data,
                    error
                } =
                    await supabase.auth
                        .signInWithPassword({
                            email,
                            password
                        });


                /*
                 * PASSWORD / EMAIL SALAH
                 */

                if (error) {

                    console.error(
                        "LOGIN ERROR:",
                        error
                    );

                    showMessage(
                        error.message ||
                        "Email atau password salah."
                    );

                    button.disabled =
                        false;

                    button.textContent =
                        "Masuk ke Dashboard";

                    return;
                }


                /*
                 * LOGIN BERHASIL
                 */

                if (!data || !data.user) {

                    showMessage(
                        "Login tidak menghasilkan data pengguna."
                    );

                    button.disabled =
                        false;

                    button.textContent =
                        "Masuk ke Dashboard";

                    return;
                }


                showMessage(
                    "Login berhasil. Membuka dashboard...",
                    "success"
                );


                /*
                 * Beri waktu sedikit agar
                 * session tersimpan.
                 */

                setTimeout(() => {

                    window.location.replace(
                        "./index.html"
                    );

                }, 500);


            } catch (error) {

                console.error(
                    "SYSTEM LOGIN ERROR:",
                    error
                );

                showMessage(
                    "Terjadi kesalahan koneksi. Silakan coba lagi."
                );

                button.disabled =
                    false;

                button.textContent =
                    "Masuk ke Dashboard";
            }

        }
    );

</script>

</body>
</html>
