<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Podcast Editor — Mandala CMS</title><link rel="stylesheet" href="css/admin.css"><script src="../js/config.js"></script><script src="../js/supabase-client.js"></script><script src="js/cms-service.js"></script><script src="js/shell.js"></script></head><body><script>initShell('Podcast Editor','podcasts')</script><main class="editor-page" style="margin-left:245px;padding:90px 32px 40px;max-width:1100px"><div class="space"><div><h1 style="margin:0">Podcast</h1><span class="hint">Tambah atau edit episode podcast.</span></div><span class="badge" id="role">—</span></div><section class="panel"><div class="panelBody"><div class="form-grid"><label>Judul<input id="title" type="text" required></label><label>Slug<input id="slug" type="text"></label><label>Kategori<select id="category_id"></select></label><label>Status<select id="status"><option value="draft">Draft</option><option value="review">Review</option><option value="published">Published</option><option value="archived">Archived</option></select></label><label>YouTube URL<input id="youtube_url" type="url" placeholder="https://youtube.com/watch?v=..."></label><label>YouTube Video ID<input id="youtube_video_id" type="text"></label><label style="grid-column:1/-1">Cover Image URL<input id="cover_image_url" type="url"></label><label style="grid-column:1/-1">Deskripsi<textarea id="description" rows="8"></textarea></label><label class="check"><input id="featured" type="checkbox"> Tampilkan sebagai featured</label></div><div class="space" style="margin-top:24px"><button id="cancel" class="btn">Batal</button><button id="save" class="btn primary">Simpan Podcast</button></div></div></section></main><div id="toast" class="toast" hidden></div><script src="js/podcast-edit.js"></script></body></html>
