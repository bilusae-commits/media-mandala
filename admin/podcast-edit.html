<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Podcast Baru — Mandala Channel</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f3;color:#202020;font-family:Arial,Helvetica,sans-serif}.page{max-width:1100px;margin:0 auto;padding:30px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.topbar-left{display:flex;align-items:center;gap:20px}.back{color:#555;text-decoration:none;font-size:12px}.back:hover{color:#000}h1{margin:0;font-size:24px}.subtitle{margin-top:5px;color:#888;font-size:12px}.logout{border:1px solid #ddd;background:#fff;color:#555;border-radius:6px;padding:9px 14px;cursor:pointer;font-size:11px}.card{background:#fff;border:1px solid #e2e2e2;border-radius:12px;padding:28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.full{grid-column:1/-1}.field{display:flex;flex-direction:column;gap:7px}label{font-size:11px;font-weight:700;color:#444}input,textarea,select{width:100%;border:1px solid #d7d7d7;border-radius:7px;background:#fff;padding:11px 12px;color:#222;font-family:inherit;font-size:12px;outline:none}input:focus,textarea:focus,select:focus{border-color:#888}textarea{min-height:160px;resize:vertical}.help{color:#999;font-size:10px}.podcast-type{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}.type-card{position:relative}.type-card input{position:absolute;opacity:0}.type-card label{display:block;padding:18px 20px;border:1px solid #d7d7d7;border-radius:7px;background:#fff;cursor:pointer}.type-card label strong{display:block;font-size:14px;margin-bottom:5px;color:#222}.type-card label span{display:block;font-size:11px;line-height:1.5;color:#888;font-weight:400}.type-card input:checked+label{border-color:#555;box-shadow:0 0 0 1px #555;background:#fafafa}.conditional{display:none}.conditional.show{display:block}.audio-upload{padding:18px;border:1px dashed #ccc;background:#fafafa;border-radius:7px}.audio-upload input{margin-top:8px}.audio-info{margin-top:10px;color:#777;font-size:10px}.audio-current{margin-top:12px;padding:11px;background:#f2f2f2;font-size:10px;word-break:break-all}.audio-current a{color:#222}.progress{display:none;margin-top:10px;height:5px;background:#e5e5e5;overflow:hidden}.progress i{display:block;width:0;height:100%;background:#555;transition:.2s}.checkbox-row{display:flex;align-items:center;gap:9px;min-height:40px}.checkbox-row input{width:auto}.checkbox-row label{font-weight:500}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:28px;padding-top:22px;border-top:1px solid #eee}.actions button{border:0;border-radius:7px;padding:11px 17px;cursor:pointer;color:#fff;background:#222;font-size:11px;font-weight:700}.form-message{margin-top:15px;font-size:11px;min-height:16px}.toast{position:fixed;right:20px;bottom:20px;background:#222;color:#fff;padding:11px 15px;border-radius:6px;font-size:11px;z-index:20}.toast.error{background:#a33}.toast[hidden]{display:none}@media(max-width:700px){.page{padding:18px}.topbar{align-items:flex-start}.topbar-left{gap:10px;flex-direction:column;align-items:flex-start}.grid{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:20px}.podcast-type{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="page">
<header class="topbar">
<div class="topbar-left"><a class="back" href="podcasts.html">← Kembali ke Podcast</a><div><h1 id="page-title">Podcast Baru</h1><div class="subtitle">Kelola podcast video dan audio</div></div></div>
<button id="logout" class="logout" type="button">Keluar</button>
</header>
<section class="card">
<div class="podcast-type">
<div class="type-card"><input id="type_video" name="content_type" type="radio" value="video" checked><label for="type_video"><strong>🎥 Video Podcast</strong><span>Podcast berbasis YouTube yang dapat diputar langsung dari website.</span></label></div>
<div class="type-card"><input id="type_audio" name="content_type" type="radio" value="audio"><label for="type_audio"><strong>🎧 Audio Podcast</strong><span>Upload MP3, M4A, WAV, OGG, atau WebM dan tampilkan pemutar audio.</span></label></div>
</div>
<form id="podcast-form" onsubmit="return false">
<div class="grid">
<div class="field full"><label for="title">Judul Podcast</label><input id="title" type="text" autocomplete="off" required></div>
<div class="field"><label for="slug">Slug</label><input id="slug" type="text" autocomplete="off"></div>
<div class="field"><label for="category_id">Kategori</label><select id="category_id"><option value="">Memuat kategori...</option></select></div>
<div id="videoFields" class="conditional show full"><div class="grid"><div class="field"><label for="youtube_url">YouTube URL</label><input id="youtube_url" type="url" placeholder="https://www.youtube.com/watch?v=..."><div class="help">YouTube Video ID akan terisi otomatis.</div></div><div class="field"><label for="youtube_video_id">YouTube Video ID</label><input id="youtube_video_id" type="text" readonly></div></div></div>
<div id="audioFields" class="conditional full"><div class="audio-upload"><strong>File Audio</strong><div class="help" style="margin-top:5px">Maksimal 50 MB. Format MP3, M4A, WAV, OGG, atau WebM.</div><input id="audio_file" type="file" accept="audio/mpeg,audio/mp4,audio/x-m4a,audio/wav,audio/ogg,audio/webm"><div id="audioInfo" class="audio-info"></div><div class="progress" id="uploadProgress"><i></i></div><div id="currentAudio" class="audio-current" hidden></div></div></div>
<div class="field full"><label for="cover_image_url">Cover Image URL</label><input id="cover_image_url" type="url" placeholder="https://..."></div>
<div class="field full"><label for="description">Deskripsi</label><textarea id="description" placeholder="Tulis deskripsi podcast..."></textarea></div>
<div class="field"><label for="status">Status</label><select id="status"><option value="draft">Draft</option><option value="review">Review</option><option value="published">Published</option><option value="archived">Archived</option></select></div>
<div class="field"><label>Podcast Unggulan</label><div class="checkbox-row"><input id="featured" type="checkbox"><label for="featured">Jadikan podcast unggulan</label></div></div>
</div>
<div class="actions"><button id="save" type="submit">Simpan</button><button id="cancel" type="button">Batal</button></div>
<div id="form-message" class="form-message"></div>
</form>
</section>
</main>
<div id="toast" class="toast" hidden></div>
<script src="../js/config.js?v=20260829"></script>
<script src="../js/supabase-client.js?v=20260829"></script>
<script src="js/podcast-edit.js?v=20260829"></script>
</body>
</html>
