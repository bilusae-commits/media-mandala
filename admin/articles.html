<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Artikel — Mandala Channel
    </title>

    <link
        rel="stylesheet"
        href="./css/admin.css"
    >

</head>


<body>


<div class="main">


    <header class="topbar">

        <div>

            <h2>
                Artikel
            </h2>

        </div>


        <div class="user">

            <a
                href="./index.html"
                class="btn ghost"
            >
                Dashboard
            </a>

            <button
                id="logout-button"
                type="button"
                class="btn primary"
            >
                Keluar
            </button>

        </div>

    </header>


    <main class="content">


        <div class="space">

            <div>

                <h2>
                    Daftar Artikel
                </h2>

                <p
                    id="page-message"
                    class="hint"
                >
                    Memuat artikel...
                </p>

            </div>


            <button
                id="new-article-button"
                type="button"
                class="btn primary"
            >
                + Artikel Baru
            </button>

        </div>


        <section class="panel">

            <div class="panelBody">

                <div
                    id="articles-container"
                >

                    <p class="hint">
                        Memuat artikel...
                    </p>

                </div>

            </div>

        </section>


    </main>

</div>


<script
    type="module"
    src="./js/articles.js"
></script>

</html>
