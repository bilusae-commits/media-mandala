<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Artikel — Mandala CMS</title><link rel="stylesheet" href="css/admin.css"><script src="../js/config.js"></script><script src="../js/supabase-client.js"></script><script src="js/cms-service.js"></script><script src="js/shell.js"></script></head><body><script>initShell("Artikel","articles")</script><div id="page" style="margin-left:245px;padding-top:70px"></div><script>
document.getElementById("page").innerHTML="<div class=\"space\"><span class=\"hint\">Kelola tulisan editorial.</span><a class=\"btn primary\" href=\"article-edit.html\">+ TAMBAH ARTIKEL</a></div><div class=\"panel\"><div class=\"panelBody\"><table class=\"table\"><thead><tr><th>Artikel</th><th>Kategori</th><th>Status</th><th>Aksi</th></tr></thead><tbody id=\"rows\"><tr><td colspan=\"4\">Memuat...</td></tr></tbody></table></div></div>";
</script><script>document.addEventListener("DOMContentLoaded",async()=>{const db=await MandalaCMS.ready();const {data,error}=await db.from("articles").select("id,title,status,categories(name)").order("created_at",{ascending:false});const rows=document.getElementById("rows");if(error){rows.innerHTML="<tr><td colspan=4>Database belum dikonfigurasi.</td></tr>";return}rows.innerHTML=(data||[]).map(x=>`<tr><td><b>${x.title}</b></td><td>${x.categories?.name||"—"}</td><td><span class="status ${x.status}">${x.status.toUpperCase()}</span></td><td><button class="mini">EDIT</button></td></tr>`).join("")||"<tr><td colspan=4>Belum ada artikel.</td></tr>"})</script></body></html>
