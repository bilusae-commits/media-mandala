<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artikel — Mandala Channel CMS</title>
<link rel="stylesheet" href="./css/admin.css">
<style>
.page{max-width:1400px;margin:0 auto;padding:30px}.page-header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:25px}.page-header h1{margin:0}.page-header p{margin:5px 0 0;color:#737373;font-size:13px}.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 15px;border:0;border-radius:7px;background:#171717;color:#fff;cursor:pointer;text-decoration:none;font-size:12px;font-weight:700}.btn:hover{opacity:.9}.message{margin-bottom:15px;color:#525252;font-size:12px}.message[data-type=error]{color:#b91c1c}.message[data-type=success]{color:#15803d}.table-card{background:#fff;border:1px solid #e5e5e5;border-radius:10px;overflow:hidden}.table-wrapper{width:100%;overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:750px}th{padding:13px 16px;background:#fafafa;border-bottom:1px solid #e5e5e5;text-align:left;color:#737373;font-size:10px;text-transform:uppercase}td{padding:15px 16px;border-bottom:1px solid #eee;font-size:12px}tr:last-child td{border-bottom:0}.article-title{font-weight:700;max-width:360px}.status{display:inline-flex;padding:4px 7px;border-radius:4px;font-size:9px;font-weight:700}.status-draft{background:#f3f4f6;color:#4b5563}.status-review{background:#fff7ed;color:#b45309}.status-published{background:#f0fdf4;color:#15803d}.status-archived{background:#f3f4f6;color:#6b7280}.actions{display:flex;flex-wrap:wrap;gap:6px}.action-link,.action-button{padding:5px 8px;border:1px solid #e5e5e5;border-radius:5px;background:#fff;color:#333;font-size:10px;text-decoration:none;cursor:pointer}.action-link:hover,.action-button:hover{background:#f5f5f5}.action-button.danger{color:#b91c1c}.empty{padding:60px 20px;text-align:center;color:#737373;font-size:12px}.empty button{padding:9px 13px;border:1px solid #ddd;border-radius:6px;background:#171717;color:#fff;cursor:pointer;font-size:11px}@media(max-width:700px){.page{padding:20px 15px}.page-header{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<main class="page">
<header class="page-header">
<div><h1>Artikel</h1><p>Kelola seluruh artikel Mandala Channel.</p></div>
<a class="btn" id="new-article-button" href="article-edit.html">+ Artikel Baru</a>
</header>
<div id="page-message" class="message"></div>
<section class="table-card"><div id="articles-container"><div class="empty">Memuat artikel...</div></div></section>
</main>
<script type="module" src="./js/articles.js"></script>
</body>
</html>
