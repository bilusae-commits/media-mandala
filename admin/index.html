<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Mandala CMS</title><link rel="stylesheet" href="css/admin.css"></head><body><div class="login"><div class="loginBox"><div class="brand"><div class="mark">✺</div><h1>MANDALA</h1><p>CHANNEL CMS</p></div><div id="err" class="error">Email atau password salah.</div><form onsubmit="event.preventDefault();login()"><div class="field"><label>EMAIL</label><input id="em" type="email" required placeholder="admin@mandalachannel.id"></div><div class="field"><label>PASSWORD</label><input id="pw" type="password" required placeholder="••••••••"></div><button class="btn primary" style="width:100%">MASUK KE CMS</button></form><div class="demo"><b>Demo:</b> admin@mandalachannel.id / mandala123<br><span class="hint">Login ini hanya prototype. Produksi harus memakai backend authentication.</span></div></div></div><script>function login(){if(em.value==='admin@mandalachannel.id'&&pw.value==='mandala123'){localStorage.setItem('mandala_cms_login','1');location.href='dashboard.html'}else{err.style.display='block'}}</script></body></html>
