<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Playlist Baru — Mandala CMS</title><link rel="stylesheet" href="css/admin.css"><script src="../js/config.js"></script><script src="../js/supabase-client.js"></script><script src="js/cms-service.js"></script><script src="js/shell.js"></script></head><body><script>initShell("Playlist Baru","playlists")</script><div id="page" style="margin-left:245px;padding-top:70px"></div><script>
document.getElementById("page").innerHTML="<div class=\"space\"><h3 style=\"font:500 23px Georgia,serif;color:#082d56\">Tambah playlist YouTube</h3><button id=\"pub\" class=\"btn primary\">PUBLISH</button></div><div class=\"formGrid\"><div class=\"panel\"><div class=\"panelBody\"><div class=\"field\"><label>NAMA PLAYLIST</label><input id=\"name\"></div><div class=\"field\"><label>URL PLAYLIST YOUTUBE</label><input id=\"youtube_url\" placeholder=\"https://www.youtube.com/playlist?list=...\"></div><div class=\"field\"><label>DESKRIPSI</label><textarea id=\"description\"></textarea></div></div></div><div class=\"panel\"><div class=\"panelBody\"><div class=\"field\"><label>KATEGORI</label><select id=\"category\"></select></div><div class=\"field\"><label>URUTAN</label><input id=\"sort_order\" type=\"number\" value=\"1\"></div><div class=\"upload\">\ud83d\udcfa<br><br>Playlist akan ditampilkan di website.</div></div></div></div>";
</script><script>document.addEventListener("DOMContentLoaded",async()=>{category.innerHTML=(await MandalaCMS.categories()).map(c=>`<option value="${c.id}">${c.name}</option>`).join("");pub.onclick=async()=>{try{await MandalaCMS.savePlaylist({name:name.value,youtube_url:youtube_url.value,description:description.value,category_id:category.value,sort_order:+sort_order.value},true);toast("Playlist dipublish.");setTimeout(()=>location.href="playlists.html",600)}catch(e){alert(e.message)}}})</script></body></html>
