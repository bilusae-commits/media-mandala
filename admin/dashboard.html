<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Mandala Channel CMS</title>
<link rel="stylesheet" href="./css/admin.css">
</head>
<body>

<!-- existing dashboard markup -->

<script type="module">
    import "../js/supabase-client.js";

    const API = window.MandalaSupabase;
    if (!API) throw new Error("MandalaSupabase belum dimuat.");
    const supabase = await API.getClient();

    /* =====================================================
       ELEMENT
    ===================================================== */

    const loading=document.getElementById("loading");
    const dashboard=document.getElementById("dashboard");
    const errorBox=document.getElementById("error-box");
    const userName=document.getElementById("user-name");
    const userRole=document.getElementById("user-role");
    const sidebarUserName=document.getElementById("sidebar-user-name");
    const sidebarUserRole=document.getElementById("sidebar-user-role");
    const userAvatar=document.getElementById("user-avatar");
    const welcomeTitle=document.getElementById("welcome-title");
    const recentArticles=document.getElementById("recent-articles");
    const logoutButton=document.getElementById("logout-button");

    function escapeHtml(value){return String(value??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
    function initials(name){const parts=String(name||"").trim().split(/\s+/).slice(0,2);if(!parts.length)return "?";return parts.map(part=>part.charAt(0).toUpperCase()).join("")}
    function formatDate(value){if(!value)return "-";const date=new Date(value);if(Number.isNaN(date.getTime()))return "-";return date.toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"})}
    function statusClass(status){const value=String(status||"draft").toLowerCase();return ["published","review","archived"].includes(value)?value:"draft"}
    function showError(message){errorBox.textContent=message||"Terjadi kesalahan.";errorBox.style.display="block"}

    async function getProfile(userId){
        const {data,error}=await supabase.from("profiles").select("id,full_name,role,avatar_url").eq("id",userId).maybeSingle();
        if(error)throw error;
        return data||null;
    }

    async function getCount(table){
        const {count,error}=await supabase.from(table).select("*",{count:"exact",head:true});
        if(error){console.warn(`Count ${table}:`,error);return 0}
        return count||0;
    }

    async function getRecentArticles(){
        const {data,error}=await supabase.from("articles").select("id,title,status,cover_image_url,created_at").order("created_at",{ascending:false}).limit(5);
        if(error)throw error;
        return data||[];
    }

    function renderArticles(articles){
        if(!articles.length){recentArticles.innerHTML='<div class="empty">Belum ada artikel.</div>';return;}
        recentArticles.innerHTML=articles.map(article=>{
            const title=escapeHtml(article.title||"Tanpa judul");
            const status=String(article.status||"draft").toLowerCase();
            const image=article.cover_image_url?`<img class="recent-image" src="${escapeHtml(article.cover_image_url)}" alt="">`:`<div class="recent-image"></div>`;
            return `<a class="recent-item" href="article-edit.html?id=${encodeURIComponent(article.id)}">${image}<div class="recent-info"><div class="recent-title">${title}</div><div class="recent-date">${formatDate(article.created_at)}</div></div><span class="status ${statusClass(status)}">${escapeHtml(status)}</span></a>`;
        }).join("");
    }

    async function init(){
        try{
            const user=await API.auth.getUser();
            if(!user){window.location.href="index.html";return;}
            const profile=await getProfile(user.id);
            if(!profile){showError("Profil pengguna tidak ditemukan.");loading.style.display="none";return;}
            const role=profile.role;
            if(role!=="admin"&&role!=="editor"){window.location.href="index.html";return;}
            const name=profile.full_name||user.email||"Pengguna";
            userName.textContent=name;userRole.textContent=role;sidebarUserName.textContent=name;sidebarUserRole.textContent=role;userAvatar.textContent=initials(name);welcomeTitle.textContent=`Selamat datang, ${name}`;
            const [articlesCount,videosCount,playlistsCount,podcastsCount,recent]=await Promise.all([getCount("articles"),getCount("videos"),getCount("playlists"),getCount("podcasts"),getRecentArticles()]);
            document.getElementById("article-count").textContent=articlesCount;
            document.getElementById("video-count").textContent=videosCount;
            document.getElementById("playlist-count").textContent=playlistsCount;
            document.getElementById("podcast-count").textContent=podcastsCount;
            renderArticles(recent);
            loading.style.display="none";dashboard.style.display="block";
        }catch(error){console.error("Dashboard error:",error);loading.style.display="none";showError(error?.message||"Dashboard gagal dimuat.")}
    }

    logoutButton?.addEventListener("click",async()=>{try{await API.auth.signOut()}finally{location.href="login.html"}});
    init();
</script>
</body>
</html>
