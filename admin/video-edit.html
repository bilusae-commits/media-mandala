<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Video Baru — Mandala Channel</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f5f3;
            color: #202020;
            font-family: Arial, Helvetica, sans-serif;
        }

        .page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .back {
            color: #555;
            text-decoration: none;
            font-size: 12px;
        }

        .back:hover {
            color: #000;
        }

        h1 {
            margin: 0;
            font-size: 24px;
        }

        .subtitle {
            margin-top: 5px;
            color: #888;
            font-size: 12px;
        }

        .logout {
            border: 1px solid #ddd;
            background: #fff;
            color: #555;
            border-radius: 6px;
            padding: 9px 14px;
            cursor: pointer;
            font-size: 11px;
        }

        .card {
            background: #fff;
            border: 1px solid #e2e2e2;
            border-radius: 12px;
            padding: 28px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .full {
            grid-column: 1 / -1;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        label {
            font-size: 11px;
            font-weight: 700;
            color: #444;
        }

        input,
        textarea,
        select {
            width: 100%;
            border: 1px solid #d7d7d7;
            border-radius: 7px;
            background: #fff;
            padding: 11px 12px;
            color: #222;
            font-family: inherit;
            font-size: 12px;
            outline: none;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #888;
        }

        textarea {
            min-height: 180px;
            resize: vertical;
        }

        .help {
            color: #999;
            font-size: 10px;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 9px;
            min-height: 40px;
        }

        .checkbox-row input {
            width: auto;
        }

        .checkbox-row label {
            font-weight: 500;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 28px;
            padding-top: 22px;
            border-top: 1px solid #eee;
        }

        .actions button {
            border: 0;
            border-radius: 7px;
            padding: 11px 17px;
            cursor: pointer;
            color: #fff;
            background: #222;
            font-size: 11px;
            font-weight: 700;
        }

        #simpan_draft {
            background: #555;
        }

        #kirim_review {
            background: #b36b00;
        }

        #publish {
            background: #23763c;
        }

        #arsipkan {
            background: #777;
        }

        .form-message {
            margin-top: 15px;
            font-size: 11px;
            min-height: 16px;
        }

        .form-message.success {
            color: #18743a;
        }

        .form-message.error {
            color: #b42318;
        }

        .form-message.warning {
            color: #a15c00;
        }

        @media (max-width: 700px) {
            .page {
                padding: 18px;
            }

            .topbar {
                align-items: flex-start;
            }

            .topbar-left {
                gap: 10px;
                flex-direction: column;
                align-items: flex-start;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<main class="page">

    <header class="topbar">

        <div class="topbar-left">

            <a
                class="back"
                href="videos.html"
            >
                ← Kembali ke Video
            </a>

            <div>
                <h1 id="page-title">
                    Video Baru
                </h1>

                <div class="subtitle">
                    Kelola konten video
                </div>
            </div>

        </div>

        <button
            id="logout"
            class="logout"
            type="button"
        >
            Keluar
        </button>

    </header>


    <section class="card">

        <form id="video-form">

            <div class="grid">

                <div class="field full">

                    <label for="judul_video">
                        Judul Video
                    </label>

                    <input
                        id="judul_video"
                        type="text"
                        autocomplete="off"
                        required
                    >

                </div>


                <div class="field">

                    <label for="slug">
                        Slug
                    </label>

                    <input
                        id="slug"
                        type="text"
                        autocomplete="off"
                        required
                    >

                </div>


                <div class="field">

                    <label for="kategori">
                        Kategori
                    </label>

                    <select id="kategori">

                        <option value="">
                            Memuat kategori...
                        </option>

                    </select>

                </div>


                <div class="field full">

                    <label for="youtube_url">
                        YouTube URL
                    </label>

                    <input
                        id="youtube_url"
                        type="url"
                        placeholder="https://www.youtube.com/watch?v=..."
                    >

                    <div class="help">
                        Masukkan URL video YouTube.
                        YouTube Video ID akan terisi otomatis.
                    </div>

                </div>


                <div class="field">

                    <label for="youtube_video_id">
                        YouTube Video ID
                    </label>

                    <input
                        id="youtube_video_id"
                        type="text"
                        readonly
                    >

                </div>


                <div class="field">

                    <label for="thumbnail_url">
                        Thumbnail URL
                    </label>

                    <input
                        id="thumbnail_url"
                        type="url"
                        placeholder="https://..."
                    >

                </div>


                <div class="field full">

                    <label for="deskripsi">
                        Deskripsi
                    </label>

                    <textarea
                        id="deskripsi"
                        placeholder="Tulis deskripsi video..."
                    ></textarea>

                </div>


                <div class="field">

                    <label for="status">
                        Status
                    </label>

                    <select id="status">

                        <option value="draft">
                            Draft
                        </option>

                        <option value="review">
                            Review
                        </option>

                        <option value="published">
                            Published
                        </option>

                        <option value="archived">
                            Archived
                        </option>

                    </select>

                </div>


                <div class="field">

                    <label>
                        Video Unggulan
                    </label>

                    <div class="checkbox-row">

                        <input
                            id="is_featured"
                            type="checkbox"
                        >

                        <label for="is_featured">
                            Jadikan video unggulan
                        </label>

                    </div>

                </div>

            </div>


            <div class="actions">

                <button
                    id="simpan"
                    type="submit"
                >
                    Simpan
                </button>

                <button
                    id="simpan_draft"
                    type="button"
                >
                    Simpan Draft
                </button>

                <button
                    id="kirim_review"
                    type="button"
                >
                    Kirim Review
                </button>

                <button
                    id="publish"
                    type="button"
                >
                    Publish
                </button>

                <button
                    id="arsipkan"
                    type="button"
                >
                    Arsipkan
                </button>

            </div>


            <div
                id="form-message"
                class="form-message"
            ></div>

        </form>

    </section>

</main>
<script src="../js/supabase-client.js"></script>
<script type="module" src="./js/video-edit.js"></script>

</body>
</html>
