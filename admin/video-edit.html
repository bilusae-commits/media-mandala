<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Video Baru — Mandala Channel</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f4f4f2;
    color: #202020;
    font-family:
        Inter,
        Arial,
        sans-serif;
}

.page {
    max-width: 1050px;
    margin: 0 auto;
    padding: 32px;
}

.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 25px;
}

.topbar-left {
    display: flex;
    align-items: center;
    gap: 15px;
}

.back {
    color: #555;
    text-decoration: none;
    font-size: 12px;
}

.back:hover {
    color: #111;
}

h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 700;
}

.subtitle {
    margin-top: 5px;
    color: #888;
    font-size: 12px;
}

.logout {
    border: 1px solid #ddd;
    background: white;
    color: #555;
    border-radius: 6px;
    padding: 9px 13px;
    cursor: pointer;
    font-size: 11px;
}

.card {
    background: white;
    border: 1px solid #e3e3e3;
    border-radius: 12px;
    padding: 28px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.full {
    grid-column: 1 / -1;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

label {
    font-size: 11px;
    font-weight: 700;
    color: #444;
}

input,
textarea,
select {
    width: 100%;
    border: 1px solid #d7d7d7;
    border-radius: 7px;
    background: white;
    padding: 11px 12px;
    font-family: inherit;
    font-size: 12px;
    color: #222;
    outline: none;
}

input:focus,
textarea:focus,
select:focus {
    border-color: #888;
}

textarea {
    min-height: 180px;
    resize: vertical;
}

.help {
    color: #999;
    font-size: 10px;
}

.checkbox {
    display: flex;
    align-items: center;
    gap: 9px;
    min-height: 40px;
}

.checkbox input {
    width: auto;
}

.checkbox label {
    margin: 0;
    font-weight: 500;
}

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 28px;
    padding-top: 22px;
    border-top: 1px solid #eee;
}

.actions button {
    border: 0;
    border-radius: 7px;
    padding: 10px 16px;
    cursor: pointer;
    font-size: 11px;
    font-weight: 700;
    background: #202020;
    color: white;
}

.actions button.secondary {
    background: #666;
}

.actions button.review {
    background: #b36b00;
}

.actions button.publish {
    background: #22733b;
}

.actions button.archive {
    background: #777;
}

.form-message {
    margin-top: 15px;
    font-size: 11px;
}

.form-message.error {
    color: #b42318;
}

.form-message.success {
    color: #207a3b;
}

.form-message.warning {
    color: #a15c00;
}

@media (max-width: 700px) {

    .page {
        padding: 18px;
    }

    .topbar {
        align-items: flex-start;
        gap: 15px;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    .full {
        grid-column: auto;
    }

    .card {
        padding: 20px;
    }

}

</style>

</head>


<body>

<main class="page">


<div class="topbar">

    <div class="topbar-left">

        <a
            class="back"
            href="videos.html"
        >
            ← Kembali ke Video
        </a>

        <div>

            <h1>
                Video Baru
            </h1>

            <div class="subtitle">
                Kelola konten video
            </div>

        </div>

    </div>


    <button
        id="logout"
        class="logout"
        type="button"
    >
        Keluar
    </button>

</div>


<section class="card">

<form id="video-form">

<div class="grid">


<div class="field full">

    <label for="judul_video">
        Judul Video
    </label>

    <input
        id="judul_video"
        type="text"
        autocomplete="off"
        required
    >

</div>


<div class="field">

    <label for="slug">
        Slug
    </label>

    <input
        id="slug"
        type="text"
        autocomplete="off"
        required
    >

</div>


<div class="field">

    <label for="kategori">
        Kategori
    </label>

    <select id="kategori">

        <option value="">
            -- Pilih Kategori --
        </option>

    </select>

</div>


<div class="field full">

    <label for="youtube_url">
        YouTube URL
    </label>

    <input
        id="youtube_url"
        type="url"
        placeholder="https://www.youtube.com/watch?v=..."
    >

    <div class="help">
        Masukkan URL video YouTube. ID video akan terisi otomatis.
    </div>

</div>


<div class="field">

    <label for="youtube_video_id">
        YouTube Video ID
    </label>

    <input
        id="youtube_video_id"
        type="text"
        readonly
    >

</div>


<div class="field">

    <label for="thumbnail_url">
        Thumbnail URL
    </label>

    <input
        id="thumbnail_url"
        type="url"
        placeholder="https://..."
    >

</div>


<div class="field full">

    <label for="deskripsi">
        Deskripsi
    </label>

    <textarea
        id="deskripsi"
        placeholder="Tulis deskripsi video..."
    ></textarea>

</div>


<div class="field">

    <label>
        Status
    </label>

    <select id="status">

        <option value="draft">
            Draft
        </option>

        <option value="review">
            Review
        </option>

        <option value="published">
            Published
        </option>

        <option value="archived">
            Archived
        </option>

    </select>

</div>


<div class="field">

    <label>
        Unggulan
    </label>

    <div class="checkbox">

        <input
            id="is_featured"
            type="checkbox"
        >

        <label for="is_featured">
            Jadikan video unggulan
        </label>

    </div>

</div>


</div>


<div class="actions">

    <button
        id="simpan"
        type="submit"
    >
        Simpan
    </button>

    <button
        id="simpan_draft"
        type="button"
        class="secondary"
    >
        Simpan Draft
    </button>

    <button
        id="kirim_review"
        type="button"
        class="review"
    >
        Kirim Review
    </button>

    <button
        id="publish"
        type="button"
        class="publish"
    >
        Publish
    </button>

    <button
        id="arsipkan"
        type="button"
        class="archive"
    >
        Arsipkan
    </button>

</div>


<div
    id="form-message"
    class="form-message"
></div>


</form>

</section>

</main>


<script
    type="module"
    src="../js/supabase-client.js"
></script>

<script
    src="./js/cms-service-final.js"
></script>

<script
    type="module"
    src="./js/video-edit.js"
></script>

</body>

</html>
