<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Video — Mandala Channel CMS</title>

</head>


<body>

    <header>

        <div>

            <h1 id="page-title">
                Video Baru
            </h1>

            <p>
                Kelola konten video
            </p>

        </div>


        <nav>

            <a href="videos.html">
                ← Kembali ke Video
            </a>

            <button
                id="logout-button"
                type="button"
            >
                Keluar
            </button>

        </nav>

    </header>


    <main>

        <form id="video-form">

            <input
                type="hidden"
                id="video-id"
            >


            <!-- =====================================
                 TITLE
            ====================================== -->

            <section>

                <label for="title">
                    Judul Video
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    required
                    autocomplete="off"
                >

            </section>


            <!-- =====================================
                 SLUG
            ====================================== -->

            <section>

                <label for="slug">
                    Slug
                </label>

                <input
                    type="text"
                    id="slug"
                    name="slug"
                    autocomplete="off"
                >

            </section>


            <!-- =====================================
                 YOUTUBE URL
            ====================================== -->

            <section>

                <label for="youtube_url">
                    YouTube URL
                </label>

                <input
                    type="url"
                    id="youtube_url"
                    name="youtube_url"
                    required
                    placeholder="https://www.youtube.com/watch?v=..."
                >

                <small>
                    Masukkan URL video YouTube.
                </small>

            </section>


            <!-- =====================================
                 VIDEO ID
            ====================================== -->

            <section>

                <label for="youtube_video_id">
                    YouTube Video ID
                </label>

                <input
                    type="text"
                    id="youtube_video_id"
                    name="youtube_video_id"
                    required
                    autocomplete="off"
                >

            </section>


            <!-- =====================================
                 THUMBNAIL
            ====================================== -->

            <section>

                <label for="thumbnail_url">
                    Thumbnail URL
                </label>

                <input
                    type="url"
                    id="thumbnail_url"
                    name="thumbnail_url"
                    placeholder="https://..."
                >

                <div id="thumbnail-preview"></div>

            </section>


            <!-- =====================================
                 DESCRIPTION
            ====================================== -->

            <section>

                <label for="description">
                    Deskripsi
                </label>

                <textarea
                    id="description"
                    name="description"
                    rows="8"
                ></textarea>

            </section>


            <!-- =====================================
                 CATEGORY
            ====================================== -->

            <section>

                <label for="category_id">
                    Kategori
                </label>

                <select
                    id="category_id"
                    name="category_id"
                >

                    <option value="">
                        -- Pilih Kategori --
                    </option>

                </select>

            </section>


            <!-- =====================================
                 FEATURED
            ====================================== -->

            <section>

                <label>

                    <input
                        type="checkbox"
                        id="featured"
                    >

                    Jadikan video unggulan

                </label>

            </section>


            <!-- =====================================
                 STATUS
            ====================================== -->

            <section>

                <label for="status">
                    Status
                </label>

                <select
                    id="status"
                    name="status"
                >

                    <option value="draft">
                        Draft
                    </option>

                    <option value="review">
                        Review
                    </option>

                    <option value="archived">
                        Archived
                    </option>

                    <option
                        value="published"
                        id="published-option"
                    >
                        Published
                    </option>

                </select>


                <small id="status-help"></small>

            </section>


            <!-- =====================================
                 MESSAGE
            ====================================== -->

            <section>

                <div id="form-message"></div>

            </section>


            <!-- =====================================
                 ACTIONS
            ====================================== -->

            <section>

                <button
                    type="submit"
                    id="save-button"
                >
                    Simpan
                </button>


                <button
                    type="button"
                    id="save-draft-button"
                >
                    Simpan Draft
                </button>


                <button
                    type="button"
                    id="submit-review-button"
                >
                    Kirim Review
                </button>


                <button
                    type="button"
                    id="publish-button"
                >
                    Publish
                </button>


                <button
                    type="button"
                    id="archive-button"
                >
                    Arsipkan
                </button>

            </section>

        </form>

    </main>


    <script
        type="module"
        src="./js/video-edit.js"
    ></script>

</body>

</html>
