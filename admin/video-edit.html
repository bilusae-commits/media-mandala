<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video Baru — Mandala CMS</title><link rel="stylesheet" href="css/admin.css"><script src="../js/config.js"></script><script src="../js/supabase-client.js"></script><script src="js/cms-service.js"></script><script src="js/shell.js"></script></head><body><script>initShell("Video Baru","videos")</script><div id="page" style="margin-left:245px;padding-top:70px"></div><script>
document.getElementById("page").innerHTML="<div class=\"space\"><h3 style=\"font:500 23px Georgia,serif;color:#082d56\">Tambah video YouTube</h3><button id=\"pub\" class=\"btn primary\">PUBLISH</button></div><div class=\"formGrid\"><div class=\"panel\"><div class=\"panelBody\"><div class=\"field\"><label>JUDUL VIDEO</label><input id=\"title\"></div><div class=\"field\"><label>URL YOUTUBE</label><input id=\"youtube_url\" placeholder=\"https://www.youtube.com/watch?v=...\"></div><div class=\"field\"><label>DESKRIPSI</label><textarea id=\"description\"></textarea></div><div class=\"field\"><label>KATEGORI</label><select id=\"category\"></select></div></div></div><div class=\"panel\"><div class=\"panelBody\"><div class=\"upload\" id=\"preview\">\u25b6<br><br>Thumbnail YouTube akan muncul otomatis.</div></div></div></div>";
</script><script>document.addEventListener("DOMContentLoaded",async()=>{category.innerHTML=(await MandalaCMS.categories()).map(c=>`<option value="${c.id}">${c.name}</option>`).join("");youtube_url.oninput=()=>{const id=MandalaCMS.youtubeId(youtube_url.value);preview.innerHTML=id?`<img src="${MandalaCMS.youtubeThumb(id)}" style="max-width:100%;max-height:180px"><br><span class="hint">${id}</span>`:"▶<br><br>Masukkan URL YouTube"};pub.onclick=async()=>{try{await MandalaCMS.saveVideo({title:title.value,youtube_url:youtube_url.value,description:description.value,category_id:category.value},true);toast("Video dipublish.");setTimeout(()=>location.href="videos.html",600)}catch(e){alert(e.message)}}})</script></body></html>
