<script type="module">

import { supabase } from "../js/supabase-client.js";


/* =====================================================
   ELEMENT
===================================================== */

const form =
    document.getElementById("video-form");

const title =
    document.getElementById("judul_video");

const slug =
    document.getElementById("slug");

const youtube =
    document.getElementById("youtube_url");

const youtubeId =
    document.getElementById("youtube_video_id");

const thumbnail =
    document.getElementById("thumbnail_url");

const description =
    document.getElementById("deskripsi");

const category =
    document.getElementById("kategori");

const featured =
    document.getElementById("is_featured");

const status =
    document.getElementById("status");

const save =
    document.getElementById("simpan");

const draft =
    document.getElementById("simpan_draft");

const review =
    document.getElementById("kirim_review");

const publish =
    document.getElementById("publish");

const archive =
    document.getElementById("arsipkan");

const logout =
    document.getElementById("logout");

const message =
    document.getElementById("form-message");


/* =====================================================
   MESSAGE
===================================================== */

function msg(text, type = "") {

    if (!message) return;

    message.textContent = text;
    message.className =
        `form-message ${type}`;
}


/* =====================================================
   SLUG
===================================================== */

function makeSlug(text) {

    return String(text || "")
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9\s-]/g, "")
        .replace(/\s+/g, "-")
        .replace(/-+/g, "-");
}


title.addEventListener(
    "input",
    () => {

        if (!slug.dataset.manual) {

            slug.value =
                makeSlug(title.value);
        }
    }
);


slug.addEventListener(
    "input",
    () => {

        slug.dataset.manual = "1";
    }
);


/* =====================================================
   YOUTUBE ID
===================================================== */

function getYoutubeId(url) {

    const value =
        String(url || "").trim();

    let match;

    match =
        value.match(
            /(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([A-Za-z0-9_-]{11})/
        );

    return match
        ? match[1]
        : "";
}


youtube.addEventListener(
    "input",
    () => {

        const id =
            getYoutubeId(
                youtube.value
            );

        youtubeId.value =
            id;

        if (
            id &&
            !thumbnail.value.trim()
        ) {

            thumbnail.value =
                `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
        }
    }
);


/* =====================================================
   CATEGORY
===================================================== */

async function loadCategories() {

    try {

        const {
            data,
            error
        } = await supabase
            .from("categories")
            .select("*")
            .order("name");


        if (error) {
            throw error;
        }


        category.innerHTML = `
            <option value="">
                -- Pilih Kategori --
            </option>
        `;


        for (
            const item of data || []
        ) {

            const option =
                document.createElement("option");

            option.value =
                item.id;

            option.textContent =
                item.name;

            category.appendChild(
                option
            );
        }


    } catch (error) {

        console.error(
            "CATEGORY ERROR:",
            error
        );

        category.innerHTML = `
            <option value="">
                -- Kategori gagal dimuat --
            </option>
        `;

        msg(
            "Kategori gagal dimuat: " +
            error.message,
            "error"
        );
    }
}


/* =====================================================
   SAVE
===================================================== */

async function saveVideo(
    targetStatus = "draft"
) {

    try {

        const userResult =
            await supabase.auth.getUser();


        if (
            userResult.error ||
            !userResult.data.user
        ) {

            throw new Error(
                "Sesi login tidak ditemukan."
            );
        }


        const user =
            userResult.data.user;


        const titleValue =
            title.value.trim();


        if (!titleValue) {

            throw new Error(
                "Judul video wajib diisi."
            );
        }


        const ytId =
            getYoutubeId(
                youtube.value
            );


        if (!ytId) {

            throw new Error(
                "Masukkan URL YouTube yang valid."
            );
        }


        msg(
            "Menyimpan..."
        );


        const payload = {

            title:
                titleValue,

            slug:
                slug.value.trim() ||
                makeSlug(titleValue),

            youtube_url:
                youtube.value.trim(),

            youtube_video_id:
                ytId,

            thumbnail_url:
                thumbnail.value.trim() ||
                `https://i.ytimg.com/vi/${ytId}/hqdefault.jpg`,

            description:
                description.value.trim() ||
                null,

            category_id:
                category.value ||
                null,

            featured:
                featured.checked,

            status:
                targetStatus,

            author_id:
                user.id
        };


        const {
            data,
            error
        } = await supabase
            .from("videos")
            .insert(payload)
            .select()
            .single();


        if (error) {
            throw error;
        }


        msg(
            "Video berhasil disimpan.",
            "success"
        );


        if (data?.id) {

            const url =
                new URL(
                    window.location.href
                );

            url.searchParams.set(
                "id",
                data.id
            );

            window.history.replaceState(
                {},
                "",
                url
            );
        }


    } catch (error) {

        console.error(
            "SAVE VIDEO ERROR:",
            error
        );

        msg(
            error.message ||
            "Gagal menyimpan video.",
            "error"
        );
    }
}


/* =====================================================
   BUTTONS
===================================================== */

form.addEventListener(
    "submit",
    event => {

        event.preventDefault();

        saveVideo("draft");
    }
);


draft.addEventListener(
    "click",
    () => {

        saveVideo("draft");
    }
);


review.addEventListener(
    "click",
    () => {

        saveVideo("review");
    }
);


publish.addEventListener(
    "click",
    () => {

        saveVideo("published");
    }
);


archive.addEventListener(
    "click",
    () => {

        saveVideo("archived");
    }
);


/* =====================================================
   LOGOUT
===================================================== */

logout.addEventListener(
    "click",
    async () => {

        const {
            error
        } =
            await supabase.auth.signOut();


        if (error) {

            msg(
                error.message,
                "error"
            );

            return;
        }


        window.location.href =
            "index.html";
    }
);


/* =====================================================
   INIT
===================================================== */

await loadCategories();

msg(
    "Editor video siap."
);

</script>
</body>

</html>
