<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Artikel — Mandala Channel CMS</title>

</head>


<body>

    <header>

        <div>

            <h1 id="page-title">
                Artikel Baru
            </h1>

            <p>
                Kelola konten artikel
            </p>

        </div>


        <nav>

            <a href="articles.html">
                ← Kembali ke Artikel
            </a>

            <button
                id="logout-button"
                type="button"
            >
                Keluar
            </button>

        </nav>

    </header>


    <main>

        <form id="article-form">

            <input
                type="hidden"
                id="article-id"
            >


            <!-- =====================================
                 TITLE
            ====================================== -->

            <section>

                <label for="title">
                    Judul
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    required
                    autocomplete="off"
                >

            </section>


            <!-- =====================================
                 SLUG
            ====================================== -->

            <section>

                <label for="slug">
                    Slug
                </label>

                <input
                    type="text"
                    id="slug"
                    name="slug"
                    required
                    autocomplete="off"
                >

                <small>
                    Contoh:
                    sejarah-candi-prambanan
                </small>

            </section>


            <!-- =====================================
                 EXCERPT
            ====================================== -->

            <section>

                <label for="excerpt">
                    Ringkasan
                </label>

                <textarea
                    id="excerpt"
                    name="excerpt"
                    rows="4"
                ></textarea>

            </section>


            <!-- =====================================
                 CONTENT
            ====================================== -->

            <section>

                <label for="content">
                    Isi Artikel
                </label>

                <textarea
                    id="content"
                    name="content"
                    rows="18"
                ></textarea>

            </section>


            <!-- =====================================
                 COVER
            ====================================== -->

            <section>

                <label for="cover_image_url">
                    URL Cover Image
                </label>

                <input
                    type="url"
                    id="cover_image_url"
                    name="cover_image_url"
                    placeholder="https://..."
                >

            </section>


            <!-- =====================================
                 CATEGORY
            ====================================== -->

            <section>

                <label for="category_id">
                    Kategori
                </label>

                <select
                    id="category_id"
                    name="category_id"
                >

                    <option value="">
                        -- Pilih Kategori --
                    </option>

                </select>

            </section>


            <!-- =====================================
                 FEATURED
            ====================================== -->

            <section>

                <label>

                    <input
                        type="checkbox"
                        id="featured"
                        name="featured"
                    >

                    Jadikan artikel unggulan

                </label>

            </section>


            <!-- =====================================
                 STATUS
            ====================================== -->

            <section>

                <label for="status">
                    Status
                </label>

                <select
                    id="status"
                    name="status"
                >

                    <option value="draft">
                        Draft
                    </option>

                    <option value="review">
                        Review
                    </option>

                    <option value="archived">
                        Archived
                    </option>

                    <option
                        value="published"
                        id="published-option"
                    >
                        Published
                    </option>

                </select>


                <small id="status-help"></small>

            </section>


            <!-- =====================================
                 MESSAGE
            ====================================== -->

            <section>

                <div id="form-message"></div>

            </section>


            <!-- =====================================
                 ACTIONS
            ====================================== -->

            <section>

                <button
                    type="submit"
                    id="save-button"
                >
                    Simpan
                </button>


                <button
                    type="button"
                    id="save-draft-button"
                >
                    Simpan Draft
                </button>


                <button
                    type="button"
                    id="submit-review-button"
                >
                    Kirim Review
                </button>


                <button
                    type="button"
                    id="publish-button"
                >
                    Publish
                </button>


                <button
                    type="button"
                    id="archive-button"
                >
                    Arsipkan
                </button>

            </section>

        </form>

    </main>


    <script
        type="module"
        src="./js/article-edit.js"
    ></script>

</body>

</html>
