<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Artikel Baru — Mandala CMS</title><link rel="stylesheet" href="css/admin.css"><script src="../js/config.js"></script><script src="../js/supabase-client.js"></script><script src="js/cms-service.js"></script><script src="js/shell.js"></script></head><body><script>initShell("Artikel Baru","articles")</script><div id="page" style="margin-left:245px;padding-top:70px"></div><script>
document.getElementById("page").innerHTML="<div class=\"space\"><div><div class=\"hint\">Konten / Artikel</div><h3 style=\"font:500 23px Georgia,serif;color:#082d56\">Buat artikel baru</h3></div><div class=\"row\"><button id=\"draft\" class=\"btn ghost\">SIMPAN DRAFT</button><button id=\"pub\" class=\"btn primary\">PUBLISH</button></div></div><div class=\"formGrid\"><div><div class=\"panel\"><div class=\"panelBody\"><div class=\"field\"><label>JUDUL</label><input id=\"title\" placeholder=\"Masukkan judul artikel...\"></div><div class=\"field\"><label>RINGKASAN</label><textarea id=\"excerpt\" style=\"min-height:90px\" placeholder=\"Ringkasan...\"></textarea></div><div class=\"field\"><label>ISI ARTIKEL</label><div class=\"toolbar\"><button onclick=\"document.execCommand('bold')\"><b>B</b></button><button onclick=\"document.execCommand('italic')\"><i>I</i></button><button onclick=\"document.execCommand('formatBlock',false,'h2')\">H2</button></div><div id=\"body\" class=\"editor\" contenteditable=\"true\">Mulai menulis artikel...</div></div></div></div></div><div><div class=\"panel\"><div class=\"panelBody\"><div class=\"field\"><label>KATEGORI</label><select id=\"category\"></select></div><div class=\"field\"><label>GAMBAR UTAMA URL</label><input id=\"cover\" placeholder=\"URL gambar\"></div><div class=\"field\"><label>SLUG</label><input id=\"slug\" placeholder=\"otomatis dari judul\"></div></div></div></div></div>";
</script><script>document.addEventListener("DOMContentLoaded",async()=>{const cats=await MandalaCMS.categories();category.innerHTML=cats.map(c=>`<option value="${c.id}">${c.name}</option>`).join("");async function save(publish){try{const x=await MandalaCMS.saveArticle({title:title.value,excerpt:excerpt.value,body:body.innerHTML,cover_url:cover.value,category_id:category.value,slug:slug.value},publish);toast(publish?"Artikel dipublish.":"Draft tersimpan.");if(publish)setTimeout(()=>location.href="articles.html",600)}catch(e){alert(e.message)}}draft.onclick=()=>save(false);pub.onclick=()=>save(true)})</script></body></html>
