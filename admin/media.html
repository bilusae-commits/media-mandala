<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Media — Mandala CMS</title><link rel="stylesheet" href="css/admin.css"><style>.media-toolbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.media-toolbar label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700}.media-toolbar input{min-width:260px}.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}.media-card{border:1px solid #e5e7eb;border-radius:14px;overflow:hidden;background:#fff}.media-thumb{height:170px;background:#f3f4f6;display:flex;align-items:center;justify-content:center}.media-thumb img{width:100%;height:100%;object-fit:cover}.media-info{padding:14px}.media-info strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.media-info small{display:block;color:#6b7280;margin:7px 0 12px}.media-actions{display:flex;gap:8px}.btn.danger{color:#b91c1c}.toast{position:fixed;right:24px;bottom:24px;padding:13px 17px;background:#111827;color:#fff;border-radius:10px;z-index:9999}.toast.error{background:#991b1b}@media(max-width:800px){.media-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.media-grid{grid-template-columns:1fr}.media-toolbar input{min-width:0;width:100%}}</style><script src="../js/config.js"></script><script src="../js/supabase-client.js"></script><script src="js/cms-service.js"></script><script src="js/shell.js"></script></head><body><script>initShell('Media','media')</script><main style="margin-left:245px;padding:90px 32px 40px"><div class="space"><div><h1 style="margin:0">Media Library</h1><span class="hint">Perpustakaan gambar dan thumbnail Mandala.</span></div><span class="badge" id="role">—</span></div><section class="panel"><div class="panelBody"><div class="media-toolbar"><label>File<input id="file" type="file" accept="image/*,video/*"></label><label>Alt text<input id="alt" type="text" placeholder="Deskripsi gambar"></label><button id="upload" class="btn primary">+ UPLOAD MEDIA</button></div><p class="hint">Maksimum 15 MB. Format gambar/video.</p></div></section><section class="panel"><div class="panelBody"><div id="grid" class="media-grid"><div class="empty">Memuat media...</div></div></div></section></main><div id="toast" class="toast" hidden></div><script src="js/media.js"></script></body></html>
