<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pengaturan — Mandala Channel CMS</title><link rel="stylesheet" href="css/cms.css?v=20260901-15"><script src="../js/config.js?v=20260901-15"></script><script src="../js/supabase-client.js?v=20260901-15"></script><script src="js/cms-service.js?v=20260901-15"></script><script src="js/shell.js?v=20260901-15"></script><style>.settings-wrap{display:grid;gap:18px;max-width:1100px}.settings-card{background:#fff;border:1px solid var(--border);border-radius:8px;overflow:hidden}.settings-card-head{padding:15px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}.settings-card-head h3{margin:0;font-size:12px}.settings-card-head p{margin:3px 0 0;font-size:8px;color:var(--muted)}.settings-card-body{padding:18px}.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.setting-field{display:flex;flex-direction:column;gap:6px}.setting-field.full{grid-column:1/-1}.setting-field label{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.setting-field input,.setting-field textarea{width:100%;box-sizing:border-box;border:1px solid var(--border);border-radius:5px;background:#fff;color:#222;padding:10px 11px;font:inherit;font-size:10px;outline:0}.setting-field textarea{min-height:100px;resize:vertical;line-height:1.5}.setting-field input:focus,.setting-field textarea:focus{border-color:var(--navy)}.setting-help{font-size:8px;color:var(--muted);line-height:1.5}.visual-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.visual-card{border:1px solid var(--border);border-radius:7px;overflow:hidden;background:#fafafa}.visual-preview{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#eee}.visual-empty{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;background:#f2f2f2;color:var(--muted);font-size:8px}.visual-label{padding:9px 10px;font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}.background-box{margin-top:16px;padding:14px;border:1px dashed var(--border);border-radius:7px;background:#fafafa}.settings-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px;padding-top:14px;border-top:1px solid var(--border)}.message{display:none;padding:10px 12px;border-radius:5px;font-size:9px;margin-bottom:14px}.message.show{display:block}.message.success{background:#f0fdf4;color:#24734f}.message.error{background:#fff1f1;color:#9b3d3d}.latest{display:flex;gap:14px;align-items:center;border:1px solid var(--border);border-radius:7px;padding:10px}.latest img{width:120px;height:76px;object-fit:cover;border-radius:5px;background:#eee}.latest-title{font-size:10px;font-weight:700;line-height:1.35}.latest-meta{font-size:8px;color:var(--muted);margin-top:4px}.settings-tip{padding:11px 13px;border-left:3px solid var(--navy);background:#f7f8fa;font-size:8px;color:#666;line-height:1.55}.url-note{font-size:8px;color:var(--muted);margin-top:2px}@media(max-width:850px){.settings-grid,.visual-grid{grid-template-columns:1fr}.setting-field.full{grid-column:auto}}@media(max-width:600px){.settings-card-head,.settings-card-body{padding:13px}.settings-actions{flex-direction:column}.settings-actions .btn{width:100%}.latest{align-items:flex-start}.latest img{width:95px;height:62px}}</style></head><body><script>'use strict';let homepage=null,latestArticle=null;const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');const $=id=>document.getElementById(id);const val=id=>$(id)?.value?.trim()||'';function msg(text,type='success'){const x=$('message');if(!x)return;x.textContent=text;x.className='message '+(text?'show ':'')+type}function visual(url,label){return '<div class="visual-card">'+(url?'<img class="visual-preview" src="'+esc(url)+'" alt="'+esc(label)+'" onerror="this.outerHTML=\'<div class=\"visual-empty\">Gambar tidak dapat dimuat</div>\'">':'<div class="visual-empty">Belum ada gambar</div>')+'<div class="visual-label">'+esc(label)+'</div></div>'}function render(){const latest=latestArticle?'<div class="latest"><img src="'+esc(latestArticle.cover_image_url||'')+'" alt="'+esc(latestArticle.title)+'"><div><div class="latest-title">'+esc(latestArticle.title)+'</div><div class="latest-meta">Artikel terbaru yang berstatus published akan diprioritaskan oleh Beranda.</div></div></div>':'<div class="latest"><div class="setting-help">Belum ada artikel berstatus published.</div></div>';document.querySelector('.content').innerHTML='<div class="page-head"><div><h1>Pengaturan</h1><p>Kelola tampilan Beranda agar mudah diperbarui ketika ada berita terbaru.</p></div></div><div class="settings-wrap"><div id="message" class="message"></div><section class="settings-card"><div class="settings-card-head"><div><h3>Hero Beranda</h3><p>Konten utama yang tampil paling menonjol pada halaman depan.</p></div></div><div class="settings-card-body"><div class="settings-grid"><div class="setting-field"><label>Label</label><input id="hero_label" value="'+esc(homepage.hero_label)+'"></div><div class="setting-field"><label>Judul utama</label><input id="hero_title" value="'+esc(homepage.hero_title)+'"></div><div class="setting-field full"><label>Deskripsi</label><textarea id="hero_description">'+esc(homepage.hero_description)+'</textarea></div><div class="setting-field"><label>Teks tombol utama</label><input id="hero_primary_label" value="'+esc(homepage.hero_primary_label)+'"></div><div class="setting-field"><label>URL tombol utama</label><input id="hero_primary_url" value="'+esc(homepage.hero_primary_url)+'"></div><div class="setting-field"><label>Teks tombol kedua</label><input id="hero_secondary_label" value="'+esc(homepage.hero_secondary_label)+'"></div><div class="setting-field"><label>URL tombol kedua</label><input id="hero_secondary_url" value="'+esc(homepage.hero_secondary_url)+'"></div></div><div class="settings-actions"><button class="btn btn-primary" id="saveHero" type="button">Simpan Hero</button></div></div></section><section class="settings-card"><div class="settings-card-head"><div><h3>Visual Beranda</h3><p>Gunakan URL gambar yang sudah tersimpan di penyimpanan media.</p></div></div><div class="settings-card-body"><div class="visual-grid">'+visual(homepage.hero_image_main,'Hero utama')+visual(homepage.hero_image_secondary,'Hero pendukung')+visual(homepage.hero_image_tertiary,'Hero ketiga')+'</div><div class="background-box"><div class="settings-grid"><div class="setting-field full"><label>Background / Overlay</label><input id="hero_overlay_image" value="'+esc(homepage.hero_overlay_image)+'" placeholder="URL gambar background transparan"></div><div class="setting-field"><label>Opacity overlay</label><input id="hero_overlay_opacity" type="number" min="0" max="1" step="0.05" value="'+esc(homepage.hero_overlay_opacity ?? 0)+'"><div class="url-note">0 = transparan, 1 = penuh.</div></div><div class="setting-field"><label>Warna background</label><input id="hero_background_color" value="'+esc(homepage.hero_background_color||'')+'" placeholder="#f7f9fb"></div></div></div><div class="settings-actions"><button class="btn btn-primary" id="saveImages" type="button">Simpan Visual</button></div></div></section><section class="settings-card"><div class="settings-card-head"><div><h3>Berita Terbaru</h3><p>Beranda membaca artikel terbit secara otomatis.</p></div></div><div class="settings-card-body"><div class="settings-tip">Ketika kamu menerbitkan berita baru dari menu Artikel, Beranda dapat membaca artikel tersebut sebagai konten terbaru tanpa perlu mengubah kode website.</div><div style="margin-top:12px">'+latest+'</div></div></section><section class="settings-card"><div class="settings-card-head"><div><h3>Tentang Website</h3><p>Data halaman Tentang tetap terpisah dari pengaturan Beranda.</p></div></div><div class="settings-card-body"><div class="setting-help">Pengaturan ini menggunakan tabel <b>homepage_settings</b>. Data <b>about_page</b> tidak diubah.</div></div></section></div>';$('saveHero').onclick=saveHero;$('saveImages').onclick=saveImages}async function load(){const rows=await MandalaCMS.select('homepage_settings','*');homepage=rows[0]||null;if(!homepage)throw new Error('Data homepage_settings belum tersedia.');try{const rows=await MandalaCMS.select('articles','id,title,cover_image_url,published_at,created_at,status');latestArticle=(rows||[]).filter(a=>a.status==='published').sort((a,b)=>new Date(b.published_at||b.created_at||0)-new Date(a.published_at||a.created_at||0))[0]||null}catch(e){latestArticle=null}render()}async function updateHome(payload){await MandalaCMS.update('homepage_settings',homepage.id,{...payload,updated_at:new Date().toISOString()});homepage={...homepage,...payload}}async function saveHero(){try{await updateHome({hero_label:val('hero_label'),hero_title:val('hero_title'),hero_description:val('hero_description'),hero_primary_label:val('hero_primary_label'),hero_primary_url:val('hero_primary_url'),hero_secondary_label:val('hero_secondary_label'),hero_secondary_url:val('hero_secondary_url')});msg('Pengaturan Hero berhasil disimpan.')}catch(e){console.error(e);msg(e.message||'Gagal menyimpan Hero.','error')}}async function saveImages(){try{const opacity=Math.min(1,Math.max(0,Number(val('hero_overlay_opacity')||0)));await updateHome({hero_overlay_image:val('hero_overlay_image'),hero_overlay_opacity:opacity,hero_background_color:val('hero_background_color')});msg('Visual Beranda berhasil disimpan.')}catch(e){console.error(e);msg(e.message||'Gagal menyimpan visual.','error')}}async function init(){const a=await MandalaCMS.getCurrentAuth();if(!a?.authenticated)return;if(a.role!=='admin'){location.replace('dashboard.html');return}await initShell('Pengaturan','settings');try{await load()}catch(e){console.error(e);document.querySelector('.content').innerHTML='<div class="settings-card"><div class="settings-card-body"><p class="settings-note">Gagal memuat pengaturan: '+esc(e.message||'Unknown error')+'</p></div></div>'}}document.addEventListener('DOMContentLoaded',()=>init().catch(e=>console.error(e)));</script></body></html>
