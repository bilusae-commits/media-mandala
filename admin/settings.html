<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pengaturan — Mandala Channel CMS</title><link rel="stylesheet" href="css/cms.css?v=20260901-16"><script src="../js/config.js?v=20260901-16"></script><script src="../js/supabase-client.js?v=20260901-16"></script><script src="js/cms-service.js?v=20260901-16"></script><script src="js/shell.js?v=20260901-16"></script><script src="js/homepage-media.js?v=20260901-16"></script><style>.settings{max-width:1100px;display:grid;gap:16px}.s-card{background:#fff;border:1px solid var(--border);border-radius:8px;overflow:hidden}.s-head{padding:15px 18px;border-bottom:1px solid var(--border)}.s-head h3{margin:0;font-size:12px}.s-head p{margin:4px 0 0;font-size:8px;color:var(--muted)}.s-body{padding:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.field input,.field textarea{box-sizing:border-box;width:100%;border:1px solid var(--border);border-radius:5px;padding:10px 11px;font:inherit;font-size:10px;background:#fff;outline:0}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field textarea:focus{border-color:var(--navy)}.actions{display:flex;justify-content:flex-end;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}.notice{font-size:8px;line-height:1.55;color:var(--muted);padding:10px 12px;background:#f7f8fa;border-left:3px solid var(--navy);margin-bottom:14px}.msg{display:none;padding:9px 11px;font-size:9px;border-radius:5px;margin-bottom:14px}.msg.show{display:block}.msg.ok{background:#f0fdf4;color:#24734f}.msg.err{background:#fff1f1;color:#9b3d3d}.media-edit-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.media-edit-card{border:1px solid var(--border);border-radius:7px;overflow:hidden;background:#fafafa}.media-preview{aspect-ratio:16/9;background:#eee;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:8px;overflow:hidden}.media-preview img{width:100%;height:100%;object-fit:cover}.media-preview.broken:after{content:'Gambar tidak dapat dimuat';font-size:8px}.media-edit-body{padding:11px}.media-edit-title{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}.media-edit-actions{display:flex;gap:7px;margin-top:9px}.media-edit-actions .btn{font-size:8px}.media-edit-status{margin-top:7px;font-size:7px;color:var(--muted)}.media-upload-btn{cursor:pointer;display:inline-flex;align-items:center;justify-content:center}@media(max-width:760px){.grid,.media-edit-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.s-body{padding:13px}.actions{flex-direction:column}.actions .btn{width:100%}}</style></head><body><script>'use strict';let homepage=null,latest=null;const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');const $=id=>document.getElementById(id);const val=id=>$(id)?.value?.trim()||'';function message(t,ok=true){const e=$('msg');e.textContent=t;e.className='msg show '+(ok?'ok':'err')}async function load(){homepage=(await MandalaCMS.select('homepage_settings','*'))[0];if(!homepage)throw Error('Data homepage_settings belum tersedia.');try{const a=await MandalaCMS.select('articles','id,title,cover_image_url,published_at,created_at,status');latest=(a||[]).filter(x=>x.status==='published').sort((x,y)=>new Date(y.published_at||y.created_at||0)-new Date(x.published_at||x.created_at||0))[0]||null}catch{latest=null}render()}function render(){document.querySelector('.content').innerHTML='<div class="page-head"><div><h1>Pengaturan</h1><p>Kelola tampilan Beranda tanpa mengubah kode website.</p></div></div><div class="settings"><div id="msg" class="msg"></div><section class="s-card"><div class="s-head"><h3>Hero Beranda</h3><p>Konten utama yang tampil pada bagian pembuka halaman.</p></div><div class="s-body"><div class="grid"><div class="field"><label>Label</label><input id="hero_label" value="'+esc(homepage.hero_label)+'"></div><div class="field"><label>Judul utama</label><input id="hero_title" value="'+esc(homepage.hero_title)+'"></div><div class="field full"><label>Deskripsi</label><textarea id="hero_description">'+esc(homepage.hero_description)+'</textarea></div><div class="field"><label>Teks tombol utama</label><input id="hero_primary_label" value="'+esc(homepage.hero_primary_label)+'"></div><div class="field"><label>URL tombol utama</label><input id="hero_primary_url" value="'+esc(homepage.hero_primary_url)+'"></div><div class="field"><label>Teks tombol kedua</label><input id="hero_secondary_label" value="'+esc(homepage.hero_secondary_label)+'"></div><div class="field"><label>URL tombol kedua</label><input id="hero_secondary_url" value="'+esc(homepage.hero_secondary_url)+'"></div></div><div class="actions"><button class="btn btn-primary" id="saveHero" type="button">Simpan Hero</button></div></div></section><section class="s-card"><div class="s-head"><h3>Gambar Beranda</h3><p>Ganti gambar langsung dari sini. File disimpan di Backblaze dan file lama yang dikelola sistem akan dihapus otomatis.</p></div><div class="s-body"><div class="notice">Klik <b>Ganti gambar</b> pada slot yang ingin diperbarui. Kamu tidak perlu menyalin URL lagi. Sistem akan menyimpan URL baru ke database dan membersihkan file lama di Backblaze.</div><div id="homepageMedia"></div><div class="grid" style="margin-top:16px"><div class="field full"><label>Background / Overlay URL</label><input id="hero_overlay_image" value="'+esc(homepage.hero_overlay_image||'')+'" placeholder="Gunakan slot Background / overlay untuk upload gambar"></div><div class="field"><label>Opacity overlay</label><input id="hero_overlay_opacity" type="number" min="0" max="1" step="0.05" value="'+esc(homepage.hero_overlay_opacity??0)+'"></div><div class="field"><label>Warna background</label><input id="hero_background_color" value="'+esc(homepage.hero_background_color||'')+'" placeholder="#f7f9fb"></div></div><div class="actions"><button class="btn btn-primary" id="saveVisual" type="button">Simpan Background</button></div></div></section><section class="s-card"><div class="s-head"><h3>Berita Terbaru</h3><p>Konten terbaru dari Artikel yang sudah diterbitkan.</p></div><div class="s-body">'+(latest?'<div class="notice"><b>'+esc(latest.title)+'</b><br>Berita terbaru berstatus published dapat dibaca otomatis oleh Beranda.</div>':'<div class="notice">Belum ada artikel berstatus published.</div>')+'</div></section><section class="s-card"><div class="s-head"><h3>Tentang Website</h3><p>Tetap terpisah dari pengaturan Beranda.</p></div><div class="s-body"><div class="notice" style="margin:0">Data <b>about_page</b> tidak diubah oleh halaman ini.</div></div></section></div>';initHomepageMedia($('homepageMedia'),homepage,x=>{homepage=x});$('saveHero').onclick=saveHero;$('saveVisual').onclick=saveVisual}async function saveHero(){try{const p={hero_label:val('hero_label'),hero_title:val('hero_title'),hero_description:val('hero_description'),hero_primary_label:val('hero_primary_label'),hero_primary_url:val('hero_primary_url'),hero_secondary_label:val('hero_secondary_label'),hero_secondary_url:val('hero_secondary_url'),updated_at:new Date().toISOString()};await MandalaCMS.update('homepage_settings',homepage.id,p);Object.assign(homepage,p);message('Hero Beranda berhasil disimpan.')}catch(e){console.error(e);message(e.message||'Gagal menyimpan Hero.',false)}}async function saveVisual(){try{const p={hero_overlay_image:val('hero_overlay_image'),hero_overlay_opacity:Math.min(1,Math.max(0,Number(val('hero_overlay_opacity')||0))),hero_background_color:val('hero_background_color'),updated_at:new Date().toISOString()};await MandalaCMS.update('homepage_settings',homepage.id,p);Object.assign(homepage,p);message('Background Beranda berhasil disimpan.')}catch(e){console.error(e);message(e.message||'Gagal menyimpan background.',false)}}async function init(){const a=await MandalaCMS.getCurrentAuth();if(!a?.authenticated)return;if(a.role!=='admin'){location.replace('dashboard.html');return}await initShell('Pengaturan','settings');try{await load()}catch(e){console.error(e);document.querySelector('.content').innerHTML='<div class="s-card"><div class="s-body"><div class="notice">Gagal memuat pengaturan: '+esc(e.message||'Unknown error')+'</div></div></div>'}}document.addEventListener('DOMContentLoaded',()=>init().catch(console.error));</script></body></html>
