<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pengaturan — Mandala Channel CMS</title><link rel="stylesheet" href="css/cms.css?v=20260901-10"><script src="../js/config.js?v=20260901-10"></script><script src="../js/supabase-client.js?v=20260901-10"></script><script src="js/cms-service.js?v=20260901-10"></script><script src="js/shell.js?v=20260901-10"></script><style>.settings-wrap{display:grid;gap:16px}.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.setting-field{display:flex;flex-direction:column;gap:6px}.setting-field.full{grid-column:1/-1}.setting-field label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}.setting-field input,.setting-field textarea,.setting-field select{width:100%;box-sizing:border-box;border:1px solid var(--border);border-radius:5px;background:#fff;color:#222;padding:10px 11px;font:inherit;font-size:10px;outline:0}.setting-field textarea{min-height:90px;resize:vertical;line-height:1.5}.setting-field input:focus,.setting-field textarea:focus,.setting-field select:focus{border-color:var(--navy)}.setting-help{font-size:8px;line-height:1.45;color:var(--muted)}.image-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.image-field{border:1px solid var(--border);border-radius:6px;padding:10px;background:#fafafa}.image-preview{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:4px;background:#eee;display:block;margin-bottom:8px}.image-preview.empty{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:8px}.overlay-row{display:grid;grid-template-columns:1fr 110px;gap:12px}.switch-row{display:flex;align-items:center;gap:8px;min-height:36px;font-size:10px;color:#555}.switch-row input{width:auto}.settings-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px;padding-top:15px;border-top:1px solid var(--border)}.settings-note{font-size:9px;line-height:1.55;color:var(--muted)}.message{display:none;padding:9px 11px;border-radius:5px;font-size:9px;margin-bottom:12px}.message.show{display:block}.message.success{background:#f0fdf4;color:#24734f}.message.error{background:#fff1f1;color:#9b3d3d}.featured-list{display:grid;gap:8px}.featured-item{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--border);border-radius:5px}.featured-item input{width:16px;height:16px}.featured-title{font-size:10px;font-weight:700}.featured-meta{font-size:8px;color:var(--muted);margin-top:2px}.empty{padding:22px;text-align:center;color:var(--muted);font-size:9px}@media(max-width:800px){.settings-grid,.image-grid{grid-template-columns:1fr}.setting-field.full{grid-column:auto}.overlay-row{grid-template-columns:1fr}}@media(max-width:600px){.settings-actions{flex-direction:column}.settings-actions .btn{width:100%}}</style></head><body><script>'use strict';let homepage=null,articles=[];const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');const $=id=>document.getElementById(id);const val=id=>$(id)?.value?.trim()||'';function msg(text,type='success'){const x=$('message');if(!x)return;x.textContent=text;x.className='message '+(text?'show ':'')+type}function imagePreview(url,label){return '<div class="image-field"><img class="image-preview" src="'+esc(url||'')+'" alt="'+esc(label)+'" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'" '+(url?'':'style="display:none"')+'><div class="image-preview empty" '+(url?'style="display:none"':'')+'>Belum ada gambar</div><div class="setting-help">URL '+esc(label)+'</div></div>'}function render(){document.querySelector('.content').innerHTML='<div class="page-head"><div><h1>Pengaturan</h1><p>Kelola identitas website dan tampilan Beranda Mandala Channel.</p></div></div><div class="settings-wrap"><section class="panel"><div class="panelHead"><h3>Beranda — Hero Utama</h3></div><div class="panelBody"><div id="message" class="message"></div><div class="settings-grid"><div class="setting-field"><label>Label</label><input id="hero_label" value="'+esc(homepage?.hero_label)+'"></div><div class="setting-field"><label>Judul utama</label><input id="hero_title" value="'+esc(homepage?.hero_title)+'"></div><div class="setting-field full"><label>Deskripsi</label><textarea id="hero_description">'+esc(homepage?.hero_description)+'</textarea></div><div class="setting-field"><label>Tombol utama</label><input id="hero_primary_label" value="'+esc(homepage?.hero_primary_label)+'"></div><div class="setting-field"><label>URL tombol utama</label><input id="hero_primary_url" value="'+esc(homepage?.hero_primary_url)+'" placeholder="https://..."></div><div class="setting-field"><label>Tombol kedua</label><input id="hero_secondary_label" value="'+esc(homepage?.hero_secondary_label)+'"></div><div class="setting-field"><label>URL tombol kedua</label><input id="hero_secondary_url" value="'+esc(homepage?.hero_secondary_url)+'" placeholder="https://..."></div></div><div class="settings-actions"><button class="btn btn-primary" id="saveHero" type="button">Simpan Beranda</button></div></div></section><section class="panel"><div class="panelHead"><h3>Gambar Beranda</h3></div><div class="panelBody"><div class="image-grid">'+imagePreview(homepage?.hero_image_main,'hero utama')+imagePreview(homepage?.hero_image_secondary,'hero pendukung')+imagePreview(homepage?.hero_image_tertiary,'hero ketiga')+'</div><div class="settings-grid" style="margin-top:14px"><div class="setting-field full"><label>Background / Overlay</label><input id="hero_overlay_image" value="'+esc(homepage?.hero_overlay_image)+'" placeholder="URL gambar transparan/background"></div><div class="setting-field"><label>Opacity overlay</label><input id="hero_overlay_opacity" type="number" min="0" max="1" step="0.05" value="'+esc(homepage?.hero_overlay_opacity ?? 0)+'"></div><div class="setting-field"><label>Warna background</label><input id="hero_background_color" value="'+esc(homepage?.hero_background_color || '')+'" placeholder="#ffffff"></div></div><div class="settings-actions"><button class="btn btn-primary" id="saveImages" type="button">Simpan Gambar & Background</button></div></div></section><section class="panel"><div class="panelHead"><h3>Berita Pilihan Beranda</h3></div><div class="panelBody"><p class="settings-note" style="margin:0 0 12px">Pilih artikel yang ingin ditonjolkan di Beranda. Ini menjadi dasar agar halaman utama bisa tetap fresh ketika ada berita baru.</p><div id="featuredList" class="featured-list">'+(articles.length?articles.map(a=>'<label class="featured-item"><input type="radio" name="featured" value="'+esc(a.id)+'" '+(homepage?.featured_article_id===a.id?'checked':'')+'><div><div class="featured-title">'+esc(a.title)+'</div><div class="featured-meta">'+esc(a.category_name||'Artikel')+'</div></div><span class="setting-help">Pilih</span></label>').join(''):'<div class="empty">Belum ada artikel yang tersedia.</div>')+'</div><div class="settings-actions"><button class="btn btn-primary" id="saveFeatured" type="button">Simpan Berita Pilihan</button></div></div></section><section class="panel"><div class="panelHead"><h3>Catatan</h3></div><div class="panelBody"><p class="settings-note" style="margin:0">Pengaturan ini menggunakan <b>homepage_settings</b>. Data lama <b>about_page</b> tetap dibiarkan untuk halaman Tentang dan tidak dihapus.</p></div></section></div>';$('saveHero').onclick=()=>saveHero();$('saveImages').onclick=()=>saveImages();$('saveFeatured').onclick=()=>saveFeatured()}async function load(){const rows=await MandalaCMS.select('homepage_settings','*');homepage=rows[0]||null;if(!homepage)throw new Error('Data homepage_settings belum tersedia.');try{articles=await MandalaCMS.select('articles','id,title,category_id');}catch(e){articles=[]}render()}async function updateHome(payload){await MandalaCMS.update('homepage_settings',homepage.id,{...payload,updated_at:new Date().toISOString()});homepage={...homepage,...payload}}async function saveHero(){try{await updateHome({hero_label:val('hero_label'),hero_title:val('hero_title'),hero_description:val('hero_description'),hero_primary_label:val('hero_primary_label'),hero_primary_url:val('hero_primary_url'),hero_secondary_label:val('hero_secondary_label'),hero_secondary_url:val('hero_secondary_url')});msg('Pengaturan Beranda berhasil disimpan.')}catch(e){console.error(e);msg(e.message||'Gagal menyimpan Beranda.','error')}}async function saveImages(){try{const opacity=Math.min(1,Math.max(0,Number(val('hero_overlay_opacity')||0)));await updateHome({hero_overlay_image:val('hero_overlay_image'),hero_overlay_opacity:opacity,hero_background_color:val('hero_background_color')});msg('Pengaturan gambar dan background berhasil disimpan.')}catch(e){console.error(e);msg(e.message||'Gagal menyimpan gambar Beranda.','error')}}async function saveFeatured(){try{const selected=document.querySelector('input[name="featured"]:checked');await updateHome({featured_article_id:selected?.value||null});msg('Berita pilihan berhasil disimpan.')}catch(e){console.error(e);msg(e.message||'Gagal menyimpan berita pilihan.','error')}}async function init(){const a=await MandalaCMS.requireAdmin();if(!a)return;await initShell('Pengaturan','settings');try{await load()}catch(e){console.error(e);document.querySelector('.content').innerHTML='<div class="panel"><div class="panelBody"><p class="settings-note">Gagal memuat pengaturan: '+esc(e.message||'Unknown error')+'</p></div></div>'}}document.addEventListener('DOMContentLoaded',()=>init().catch(e=>console.error(e)));</script></body></html>
