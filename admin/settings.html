<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pengaturan — Mandala CMS</title><link rel="stylesheet" href="css/admin.css"><script src="../js/config.js"></script><script src="../js/supabase-client.js"></script><script src="js/cms-service.js"></script><script src="js/shell.js"></script><style>.settingsGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:15px}.field label{font-size:9px;color:var(--m);text-transform:uppercase;letter-spacing:.08em;font-weight:700}.field input,.field textarea{width:100%;box-sizing:border-box;border:1px solid var(--l);border-radius:5px;padding:11px 12px;background:#fff;color:var(--i);outline:0;font:inherit}.field textarea{min-height:110px;resize:vertical;line-height:1.5}.field input:focus,.field textarea:focus{border-color:var(--n)}.full{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:5px}.btn{border:1px solid var(--l);background:#fff;color:var(--n);border-radius:5px;padding:10px 15px;cursor:pointer;font-size:10px;font-weight:700}.btn.primary{background:var(--n);color:#fff;border-color:var(--n)}.hint{font-size:10px;line-height:1.6;color:var(--m);margin:0}.message{display:none;margin-bottom:15px;padding:10px 12px;border-radius:4px;background:#f1f7f4;color:#287051;font-size:10px}.message.error{background:#fff0f0;color:#9b3d3d}@media(max-width:700px){.settingsGrid{grid-template-columns:1fr}.full{grid-column:auto}.actions{justify-content:stretch}.actions .btn{width:100%}}</style></head><body><script>'use strict';let about=null;const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');function input(id,label,value,full=false){return '<div class="field '+(full?'full':'')+'"><label for="'+id+'">'+label+'</label><input id="'+id+'" value="'+esc(value)+'"></div>'}function area(id,label,value,full=true){return '<div class="field '+(full?'full':'')+'"><label for="'+id+'">'+label+'</label><textarea id="'+id+'">'+esc(value)+'</textarea></div>'}function render(){document.querySelector('.content').innerHTML='<div class="panel"><div class="panelHead"><h3>Identitas Website</h3></div><div class="panelBody"><div id="message" class="message"></div><form id="settingsForm"><div class="settingsGrid">'+input('hero_label','Label halaman',about.hero_label)+input('hero_title','Judul utama',about.hero_title)+area('hero_description','Deskripsi utama',about.hero_description)+input('intro_label','Label pengantar',about.intro_label)+input('intro_title','Judul pengantar',about.intro_title)+area('intro_content','Isi pengantar',about.intro_content)+area('manifesto','Manifesto')+'</div><div class="actions"><button class="btn" type="button" id="resetBtn">Batal</button><button class="btn primary" type="submit" id="saveBtn">Simpan Pengaturan</button></div></form></div></div><div class="panel"><div class="panelHead"><h3>Catatan</h3></div><div class="panelBody"><p class="hint">Pengaturan ini menggunakan data halaman Tentang Mandala yang tersimpan di Supabase. Konfigurasi koneksi database tetap berada di js/config.js.</p></div></div>';document.getElementById('settingsForm').onsubmit=save;document.getElementById('resetBtn').onclick=render}async function load(){const rows=await MandalaCMS.select('about_page','*');about=rows[0];if(!about)throw new Error('Data about_page belum tersedia.');render()}async function save(e){e.preventDefault();const btn=document.getElementById('saveBtn'),message=document.getElementById('message');const payload={hero_label:document.getElementById('hero_label').value.trim(),hero_title:document.getElementById('hero_title').value.trim(),hero_description:document.getElementById('hero_description').value.trim(),intro_label:document.getElementById('intro_label').value.trim(),intro_title:document.getElementById('intro_title').value.trim(),intro_content:document.getElementById('intro_content').value.trim(),manifesto:document.getElementById('manifesto').value.trim(),updated_at:new Date().toISOString()};try{btn.disabled=true;await MandalaCMS.update('about_page',about.id,payload);about={...about,...payload};message.textContent='Pengaturan berhasil disimpan.';message.className='message';message.style.display='block'}catch(err){console.error(err);message.textContent=err.message||'Gagal menyimpan pengaturan.';message.className='message error';message.style.display='block'}finally{btn.disabled=false}}async function init(){const a=await MandalaCMS.requireAdmin();if(!a)return;await initShell('Pengaturan','settings');try{await load()}catch(e){console.error(e);document.querySelector('.content').innerHTML='<div class="panel"><div class="panelBody"><p class="hint">Gagal memuat pengaturan: '+esc(e.message||'Unknown error')+'</p></div></div>'}}document.addEventListener('DOMContentLoaded',init);</script></body></html>
