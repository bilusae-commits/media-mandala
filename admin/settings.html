<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pengaturan — Mandala Channel CMS</title><link rel="stylesheet" href="css/cms.css?v=20260901-14"><script src="../js/config.js?v=20260901-14"></script><script src="../js/supabase-client.js?v=20260901-14"></script><script src="js/cms-service.js?v=20260901-14"></script><script src="js/shell.js?v=20260901-14"></script><style>.settings-wrap{display:grid;gap:16px}.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.setting-field{display:flex;flex-direction:column;gap:6px}.setting-field.full{grid-column:1/-1}.setting-field label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}.setting-field input,.setting-field textarea{width:100%;box-sizing:border-box;border:1px solid var(--border);border-radius:5px;background:#fff;color:#222;padding:10px 11px;font:inherit;font-size:10px;outline:0}.setting-field textarea{min-height:90px;resize:vertical;line-height:1.5}.setting-help,.settings-note{font-size:8px;line-height:1.5;color:var(--muted)}.image-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.image-field{border:1px solid var(--border);border-radius:6px;padding:10px;background:#fafafa}.image-preview{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:4px;background:#eee;display:block;margin-bottom:8px}.image-preview.empty{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:8px}.settings-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px;padding-top:15px;border-top:1px solid var(--border)}.message{display:none;padding:9px 11px;border-radius:5px;font-size:9px;margin-bottom:12px}.message.show{display:block}.message.success{background:#f0fdf4;color:#24734f}.message.error{background:#fff1f1;color:#9b3d3d}.latest{display:flex;gap:12px;align-items:center;border:1px solid var(--border);border-radius:6px;padding:10px}.latest img{width:110px;height:70px;object-fit:cover;border-radius:4px;background:#eee}.latest-title{font-size:10px;font-weight:700}.latest-meta{font-size:8px;color:var(--muted);margin-top:4px}@media(max-width:800px){.settings-grid,.image-grid{grid-template-columns:1fr}.setting-field.full{grid-column:auto}}@media(max-width:600px){.settings-actions{flex-direction:column}.settings-actions .btn{width:100%}.latest{align-items:flex-start}.latest img{width:90px;height:58px}}</style></head><body><script>'use strict';let homepage=null,latestArticle=null;const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');const $=id=>document.getElementById(id);const val=id=>$(id)?.value?.trim()||'';function msg(text,type='success'){const x=$('message');if(!x)return;x.textContent=text;x.className='message '+(text?'show ':'')+type}function imagePreview(url,label){return '<div class="image-field"><img class="image-preview" src="'+esc(url||'')+'" alt="'+esc(label)+'" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'" '+(url?'':'style="display:none"')+'><div class="image-preview empty" '+(url?'style="display:none"':'')+'>Belum ada gambar</div><div class="setting-help">'+esc(label)+'</div></div>'}function render(){const article=latestArticle?'<div class="latest"><img src="'+esc(latestArticle.cover_image_url||'')+'" alt="'+esc(latestArticle.title)+'"><div><div class="latest-title">'+esc(latestArticle.title)+'</div><div class="latest-meta">Berita terbaru berstatus terbit akan dibaca otomatis oleh Beranda.</div></div></div>':'<div class="latest"><div class="settings-note">Belum ada artikel terbit.</div></div>';document.querySelector('.content').innerHTML='<div class="page-head"><div><h1>Pengaturan</h1><p>Kelola tampilan Beranda dan identitas Mandala Channel.</p></div></div><div class="settings-wrap"><section class="panel"><div class="panelHead"><h3>Beranda — Hero Utama</h3></div><div class="panelBody"><div id="message" class="message"></div><div class="settings-grid"><div class="setting-field"><label>Label</label><input id="hero_label" value="'+esc(homepage.hero_label)+'"></div><div class="setting-field"><label>Judul utama</label><input id="hero_title" value="'+esc(homepage.hero_title)+'"></div><div class="setting-field full"><label>Deskripsi</label><textarea id="hero_description">'+esc(homepage.hero_description)+'</textarea></div><div class="setting-field"><label>Tombol utama</label><input id="hero_primary_label" value="'+esc(homepage.hero_primary_label)+'"></div><div class="setting-field"><label>URL tombol utama</label><input id="hero_primary_url" value="'+esc(homepage.hero_primary_url)+'"></div><div class="setting-field"><label>Tombol kedua</label><input id="hero_secondary_label" value="'+esc(homepage.hero_secondary_label)+'"></div><div class="setting-field"><label>URL tombol kedua</label><input id="hero_secondary_url" value="'+esc(homepage.hero_secondary_url)+'"></div></div><div class="settings-actions"><button class="btn btn-primary" id="saveHero" type="button">Simpan Beranda</button></div></div></section><section class="panel"><div class="panelHead"><h3>Gambar Beranda</h3></div><div class="panelBody"><div class="image-grid">'+imagePreview(homepage.hero_image_main,'Hero utama')+imagePreview(homepage.hero_image_secondary,'Hero pendukung')+imagePreview(homepage.hero_image_tertiary,'Hero ketiga')+'</div><div class="settings-grid" style="margin-top:14px"><div class="setting-field full"><label>Background / Overlay</label><input id="hero_overlay_image" value="'+esc(homepage.hero_overlay_image)+'" placeholder="URL gambar transparan/background"></div><div class="setting-field"><label>Opacity overlay</label><input id="hero_overlay_opacity" type="number" min="0" max="1" step="0.05" value="'+esc(homepage.hero_overlay_opacity)+'"></div><div class="setting-field"><label>Warna background</label><input id="hero_background_color" value="'+esc(homepage.hero_background_color)+'" placeholder="#f7f9fb"></div></div><div class="settings-actions"><button class="btn btn-primary" id="saveImages" type="button">Simpan Gambar & Background</button></div></div></section><section class="panel"><div class="panelHead"><h3>Berita Terbaru</h3></div><div class="panelBody"><p class="settings-note" style="margin:0 0 12px">Beranda otomatis membaca artikel terbaru yang berstatus <b>published</b>, sehingga berita baru dapat masuk tanpa mengubah kode Index.</p>'+article+'</div></section><section class="panel"><div class="panelHead"><h3>Tentang Website</h3></div><div class="panelBody"><p class="settings-note" style="margin:0">Data <b>about_page</b> tetap digunakan halaman Tentang Kami dan tidak diubah oleh pengaturan Beranda.</p></div></section></div>';$('saveHero').onclick=saveHero;$('saveImages').onclick=saveImages}async function load(){const rows=await MandalaCMS.select('homepage_settings','*');homepage=rows[0]||null;if(!homepage)throw new Error('Data homepage_settings belum tersedia.');try{const rows=await MandalaCMS.select('articles','id,title,cover_image_url,published_at,created_at,status');latestArticle=(rows||[]).filter(a=>a.status==='published').sort((a,b)=>new Date(b.published_at||b.created_at||0)-new Date(a.published_at||a.created_at||0))[0]||null}catch(e){latestArticle=null}render()}async function updateHome(payload){await MandalaCMS.update('homepage_settings',homepage.id,{...payload,updated_at:new Date().toISOString()});homepage={...homepage,...payload}}async function saveHero(){try{await updateHome({hero_label:val('hero_label'),hero_title:val('hero_title'),hero_description:val('hero_description'),hero_primary_label:val('hero_primary_label'),hero_primary_url:val('hero_primary_url'),hero_secondary_label:val('hero_secondary_label'),hero_secondary_url:val('hero_secondary_url')});msg('Pengaturan Beranda berhasil disimpan.')}catch(e){console.error(e);msg(e.message||'Gagal menyimpan Beranda.','error')}}async function saveImages(){try{const opacity=Math.min(1,Math.max(0,Number(val('hero_overlay_opacity')||0)));await updateHome({hero_overlay_image:val('hero_overlay_image'),hero_overlay_opacity:opacity,hero_background_color:val('hero_background_color')});msg('Pengaturan gambar dan background berhasil disimpan.')}catch(e){console.error(e);msg(e.message||'Gagal menyimpan gambar Beranda.','error')}}async function init(){const a=await MandalaCMS.getCurrentAuth();if(!a)return;if(a.role!=='admin'){location.replace('dashboard.html');return}await initShell('Pengaturan','settings');try{await load()}catch(e){console.error(e);document.querySelector('.content').innerHTML='<div class="panel"><div class="panelBody"><p class="settings-note">Gagal memuat pengaturan: '+esc(e.message||'Unknown error')+'</p></div></div>'}}document.addEventListener('DOMContentLoaded',()=>init().catch(e=>console.error(e)));</script></body></html>
