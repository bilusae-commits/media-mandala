<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kategori — Mandala CMS</title><link rel="stylesheet" href="css/cms.css?v=20260901-4"><script src="../js/config.js?v=20260901-4"></script><script src="../js/supabase-client.js?v=20260901-4"></script><script src="js/cms-service.js?v=20260901-4"></script><script src="js/shell.js?v=20260901-4"></script><style>.categoryForm{display:grid;grid-template-columns:2fr 2fr 120px 110px auto;gap:12px;align-items:end}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:9px;color:var(--m);text-transform:uppercase;letter-spacing:.08em;font-weight:700}.field input{width:100%;box-sizing:border-box;border:1px solid var(--l);border-radius:5px;padding:11px 12px;background:#fff;color:var(--i);outline:0}.field input:focus{border-color:var(--n)}.check{display:flex;align-items:center;gap:7px;height:40px;font-size:11px;color:#526170}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid var(--l);background:#fff;color:var(--n);border-radius:5px;padding:9px 12px;cursor:pointer;font-size:10px;font-weight:700}.btn:hover{background:#f5f7f9}.btn.primary{background:var(--n);color:#fff;border-color:var(--n)}.btn.danger{color:#a33b3b}.catTable{width:100%;border-collapse:collapse}.catTable th{text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--m);padding:11px;border-bottom:1px solid var(--l)}.catTable td{padding:13px 11px;border-bottom:1px solid var(--l);font-size:11px;vertical-align:middle}.catTable tr:last-child td{border-bottom:0}.status{display:inline-block;padding:4px 7px;border-radius:3px;font-size:8px;font-weight:700}.status.on{background:#e9f7ef;color:#25855b}.status.off{background:#f3f3f3;color:#777}.muted{color:var(--m);font-size:10px}.empty{text-align:center;padding:40px;color:var(--m);font-size:11px}.message{margin:0 0 15px;padding:10px 12px;border-radius:4px;background:#f4f7fa;color:#526170;font-size:10px;display:none}.message.error{background:#fff0f0;color:#9b3d3d}@media(max-width:1000px){.categoryForm{grid-template-columns:1fr 1fr}.categoryForm .actions{grid-column:1/-1}}@media(max-width:600px){.categoryForm{grid-template-columns:1fr}.catTable{display:block;overflow-x:auto;white-space:nowrap}.panelBody{padding:15px}.actions .btn{padding:8px 10px}}</style></head><body><script>'use strict';let categories=[];const slugify=v=>String(v||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');function formHtml(){return '<div class="panel"><div class="panelHead"><h3 id="formTitle">Tambah Kategori</h3></div><div class="panelBody"><div id="message" class="message"></div><form id="categoryForm" class="categoryForm"><input type="hidden" id="categoryId"><div class="field"><label>Nama kategori</label><input id="name" required maxlength="100" placeholder="Contoh: Tokoh Hindu"></div><div class="field"><label>Slug</label><input id="slug" required maxlength="120" placeholder="tokoh-hindu"></div><div class="field"><label>Urutan</label><input id="sortOrder" type="number" min="0" value="0"></div><label class="check"><input id="active" type="checkbox" checked> Aktif</label><div class="actions"><button class="btn primary" type="submit" id="saveBtn">Simpan</button><button class="btn" type="button" id="cancelBtn" style="display:none">Batal</button></div></form></div></div>'}function listHtml(){return '<div class="panel"><div class="panelHead"><h3>Daftar Kategori</h3><span class="muted">'+categories.length+' kategori</span></div><div class="panelBody"><div id="tableWrap">'+(categories.length?'<table class="catTable"><thead><tr><th>Nama</th><th>Slug</th><th>Urutan</th><th>Status</th><th>Aksi</th></tr></thead><tbody>'+categories.map(c=>'<tr><td><b>'+esc(c.name)+'</b>'+(c.description?'<div class="muted">'+esc(c.description)+'</div>':'')+'</td><td class="muted">'+esc(c.slug)+'</td><td>'+Number(c.sort_order||0)+'</td><td><span class="status '+(c.is_active?'on':'off')+'">'+(c.is_active?'Aktif':'Nonaktif')+'</span></td><td><div class="actions"><button class="btn" data-edit="'+c.id+'">Edit</button><button class="btn" data-toggle="'+c.id+'">'+(c.is_active?'Nonaktifkan':'Aktifkan')+'</button><button class="btn danger" data-delete="'+c.id+'">Hapus</button></div></td></tr>').join('')+'</tbody></table>':'<div class="empty">Belum ada kategori.</div>')+'</div></div></div>'}function msg(t,e){const x=document.getElementById('message');if(x){x.textContent=t;x.className='message'+(e?' error':'');x.style.display='block'}}function reset(){document.getElementById('categoryForm').reset();document.getElementById('categoryId').value='';document.getElementById('sortOrder').value='0';document.getElementById('active').checked=true;document.getElementById('formTitle').textContent='Tambah Kategori';document.getElementById('saveBtn').textContent='Simpan';document.getElementById('cancelBtn').style.display='none'}function edit(id){const c=categories.find(x=>x.id===id);if(!c)return;document.getElementById('categoryId').value=c.id;document.getElementById('name').value=c.name||'';document.getElementById('slug').value=c.slug||'';document.getElementById('sortOrder').value=c.sort_order||0;document.getElementById('active').checked=c.is_active!==false;document.getElementById('formTitle').textContent='Edit Kategori';document.getElementById('saveBtn').textContent='Simpan Perubahan';document.getElementById('cancelBtn').style.display='inline-block';window.scrollTo({top:0,behavior:'smooth'})}function bind(){document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{const c=categories.find(x=>x.id===b.dataset.toggle);try{await MandalaCMS.update('categories',c.id,{is_active:!c.is_active,updated_at:new Date().toISOString()});await refresh()}catch(e){alert(e.message||'Gagal mengubah status')}});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{const c=categories.find(x=>x.id===b.dataset.delete);if(!c||!confirm('Hapus kategori "'+c.name+'"?'))return;try{const rows=await MandalaCMS.select('articles','id,category_id');if(rows.some(a=>a.category_id===c.id)){alert('Kategori masih digunakan oleh artikel. Nonaktifkan saja kategori ini agar artikel tetap aman.');return}await MandalaCMS.remove('categories',c.id);await refresh()}catch(e){alert(e.message||'Gagal menghapus kategori')}})}function render(){const x=document.getElementById('listPanel');if(x)x.innerHTML=listHtml();bind()}async function refresh(){categories=await MandalaCMS.categories();render()}async function save(e){e.preventDefault();const id=document.getElementById('categoryId').value,name=document.getElementById('name').value.trim(),slug=slugify(document.getElementById('slug').value||name),sort_order=Math.max(0,Number(document.getElementById('sortOrder').value||0)),is_active=document.getElementById('active').checked;if(!name||!slug)return msg('Nama dan slug wajib diisi.',true);if(categories.some(c=>c.slug===slug&&c.id!==id))return msg('Slug sudah digunakan kategori lain.',true);try{document.getElementById('saveBtn').disabled=true;const p={name,slug,sort_order,is_active,updated_at:new Date().toISOString()};if(id)await MandalaCMS.update('categories',id,p);else await MandalaCMS.insert('categories',p);await refresh();reset()}catch(e){console.error(e);msg(e.message||'Gagal menyimpan kategori.',true)}finally{document.getElementById('saveBtn').disabled=false}}async function init(){const a=await MandalaCMS.requireStaff();if(!a)return;if(a.role!=='admin')return location.replace('index.html');await initShell('Kategori','categories');document.querySelector('.content').innerHTML='<div id="formPanel">'+formHtml()+'</div><div id="listPanel">'+listHtml()+'</div>';document.getElementById('categoryForm').onsubmit=save;document.getElementById('cancelBtn').onclick=reset;try{await refresh()}catch(e){console.error(e);msg(e.message||'Gagal memuat kategori.',true)}}document.addEventListener('DOMContentLoaded',init);</script></body></html>
