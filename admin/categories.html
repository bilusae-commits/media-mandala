<!doctype html>
<html lang="id">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    >

    <title>Kategori — Mandala CMS</title>

    <link
        rel="stylesheet"
        href="css/admin.css"
    >

    <script src="../js/config.js"></script>
    <script src="../js/supabase-client.js"></script>
    <script src="js/cms-service.js"></script>
    <script src="js/shell.js"></script>

</head>


<body>

<script>

async function initCategoryPage() {

    const allowed =
        await MandalaCMS.requireAdmin();

    if (!allowed) {
        return;
    }


    await initShell(
        "Kategori",
        "categories"
    );


    document.getElementById(
        "page"
    ).innerHTML = `

        <div class="panel">

            <div class="panelHead">

                <h3>
                    Kategori Mandala
                </h3>

            </div>


            <div class="panelBody">

                <div
                    id="cat"
                    class="empty"
                >
                    Memuat...
                </div>

            </div>

        </div>

    `;


    try {

        const data =
            await MandalaCMS.categories();


        document.getElementById(
            "cat"
        ).innerHTML =

            data.length

                ? data.map(
                    function (item) {

                        return `
                            <p>
                                <b>
                                    ${escapeHtml(item.name)}
                                </b>

                                <span class="hint">
                                    ${escapeHtml(item.slug)}
                                </span>
                            </p>
                        `;

                    }
                ).join("")

                : "Belum ada kategori.";


    } catch (error) {

        console.error(
            "Category loading error:",
            error
        );


        document.getElementById(
            "cat"
        ).textContent =
            error.message ||
            "Gagal memuat kategori.";
    }

}


document.addEventListener(
    "DOMContentLoaded",
    initCategoryPage
);

</script>


<div
    id="page"
    style="margin-left:245px;padding-top:70px"
></div>


</body>

</html>
