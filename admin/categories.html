<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kategori — Mandala CMS</title><link rel="stylesheet" href="css/admin.css"><script src="../js/config.js"></script><script src="../js/supabase-client.js"></script><script src="js/cms-service.js"></script><script src="js/shell.js"></script></head><body><script>initShell("Kategori","categories")</script><div id="page" style="margin-left:245px;padding-top:70px"></div><script>
document.getElementById("page").innerHTML="<div class=\"panel\"><div class=\"panelHead\"><h3>Kategori Mandala</h3></div><div class=\"panelBody\"><div id=\"cat\" class=\"empty\">Memuat...</div></div></div>";
</script><script>document.addEventListener("DOMContentLoaded",async()=>{try{const d=await MandalaCMS.categories();cat.innerHTML=d.map(x=>`<p><b>${x.name}</b> <span class="hint">${x.slug}</span></p>`).join("")}catch(e){cat.textContent=e.message}})</script></body></html>
