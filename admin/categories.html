<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kategori — Mandala Channel CMS</title><link rel="stylesheet" href="css/cms.css?v=20260901-9"><script src="../js/config.js?v=20260901-9"></script><script src="../js/supabase-client.js?v=20260901-9"></script><script src="js/cms-service.js?v=20260901-9"></script><script src="js/shell.js?v=20260901-9"></script></head><body><script>'use strict';let categories=[];const $=id=>document.getElementById(id);const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');const slugify=v=>String(v||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');function showMessage(text,type=''){const x=$('categoryMessage');if(!x)return;x.textContent=text;x.className='category-message '+(text?'show ':'')+type}function resetForm(){ $('categoryId').value='';$('categoryName').value='';$('categorySlug').value='';$('categoryOrder').value='0';$('categoryActive').checked=true;$('categorySlug').dataset.manual='';$('formTitle').textContent='Tambah Kategori';$('formDesc').textContent='Buat kategori baru untuk mengelompokkan artikel, video, dan podcast.';$('saveBtn').textContent='Simpan Kategori';$('cancelBtn').style.display='none';showMessage('')}function formHtml(){return '<section class="category-card"><div class="category-card-head"><h3 id="formTitle">Tambah Kategori</h3><p id="formDesc">Buat kategori baru untuk mengelompokkan artikel, video, dan podcast.</p></div><div class="category-card-body"><div id="categoryMessage" class="category-message"></div><form id="categoryForm"><input type="hidden" id="categoryId"><div class="category-field"><label for="categoryName">Nama kategori</label><input id="categoryName" maxlength="100" required placeholder="Contoh: Tokoh Hindu"><div class="category-help">Nama yang terlihat pada konten dan panel admin.</div></div><div class="category-field"><label for="categorySlug">Slug</label><input id="categorySlug" maxlength="120" required placeholder="tokoh-hindu"><div class="category-help">Huruf kecil dan tanda hubung. Otomatis dari nama sampai diubah manual.</div></div><div class="category-row"><div class="category-field"><label for="categoryOrder">Urutan</label><input id="categoryOrder" type="number" min="0" value="0"></div><label class="category-check"><input id="categoryActive" type="checkbox" checked> Aktif</label></div><div class="category-actions"><button class="btn btn-primary" id="saveBtn" type="submit">Simpan Kategori</button><button class="btn btn-light" id="cancelBtn" type="button" style="display:none">Batal</button></div></form></div></section>'}function listHtml(){return '<section class="category-card"><div class="category-card-head"><div class="category-list-head"><div><h3>Daftar Kategori</h3><p>Kategori yang tersedia untuk konten Mandala Channel.</p></div><span class="category-count">'+categories.length+' kategori</span></div></div><div class="category-table-wrap">'+(categories.length?'<table class="category-table"><thead><tr><th>Kategori</th><th>Urutan</th><th>Status</th><th>Aksi</th></tr></thead><tbody>'+categories.map(c=>'<tr><td><div class="category-name">'+esc(c.name)+'</div><div class="category-slug">'+esc(c.slug||'—')+'</div></td><td>'+Number(c.sort_order||0)+'</td><td><span class="category-status '+(c.is_active!==false?'active':'inactive')+'">'+(c.is_active!==false?'Aktif':'Nonaktif')+'</span></td><td><div class="category-actions-cell"><button class="category-action" data-edit="'+esc(c.id)+'">Edit</button><button class="category-action" data-toggle="'+esc(c.id)+'">'+(c.is_active!==false?'Nonaktifkan':'Aktifkan')+'</button><button class="category-action danger" data-delete="'+esc(c.id)+'">Hapus</button></div></td></tr>').join('')+'</tbody></table>':'<div class="category-empty"><strong>Belum ada kategori</strong>Tambahkan kategori pertama melalui formulir di sebelah kiri.</div>')+'</div></section>'}function edit(id){const c=categories.find(x=>x.id===id);if(!c)return;$('categoryId').value=c.id;$('categoryName').value=c.name||'';$('categorySlug').value=c.slug||'';$('categorySlug').dataset.manual='1';$('categoryOrder').value=c.sort_order||0;$('categoryActive').checked=c.is_active!==false;$('formTitle').textContent='Edit Kategori';$('formDesc').textContent='Perbarui informasi kategori tanpa mengubah konten yang sudah menggunakannya.';$('saveBtn').textContent='Simpan Perubahan';$('cancelBtn').style.display='inline-flex';showMessage('');window.scrollTo({top:0,behavior:'smooth'})}function bindList(){document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{const c=categories.find(x=>x.id===b.dataset.toggle);if(!c)return;try{await MandalaCMS.update('categories',c.id,{is_active:c.is_active===false,updated_at:new Date().toISOString()});await refresh();showMessage('Status kategori diperbarui.','success')}catch(e){console.error(e);showMessage(e.message||'Gagal mengubah status kategori.','error')}});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{const c=categories.find(x=>x.id===b.dataset.delete);if(!c||!confirm('Hapus kategori "'+c.name+'"?'))return;try{const rows=await MandalaCMS.select('articles','id,category_id');if(rows.some(a=>a.category_id===c.id)){showMessage('Kategori masih digunakan oleh artikel. Nonaktifkan kategori ini agar artikel tetap aman.','error');return}await MandalaCMS.remove('categories',c.id);resetForm();await refresh();showMessage('Kategori berhasil dihapus.','success')}catch(e){console.error(e);showMessage(e.message||'Gagal menghapus kategori.','error')}})}function renderList(){const x=$('listPanel');if(x){x.innerHTML=listHtml();bindList()}}async function refresh(){categories=await MandalaCMS.categories();renderList()}async function save(e){e.preventDefault();const id=$('categoryId').value,name=$('categoryName').value.trim(),slug=slugify($('categorySlug').value||name),sort_order=Math.max(0,Number($('categoryOrder').value||0)),is_active=$('categoryActive').checked;if(!name||!slug)return showMessage('Nama dan slug wajib diisi.','error');if(categories.some(c=>c.slug===slug&&c.id!==id))return showMessage('Slug sudah digunakan kategori lain.','error');try{$('saveBtn').disabled=true;const payload={name,slug,sort_order,is_active,updated_at:new Date().toISOString()};if(id)await MandalaCMS.update('categories',id,payload);else await MandalaCMS.insert('categories',payload);resetForm();await refresh();showMessage(id?'Kategori berhasil diperbarui.':'Kategori berhasil ditambahkan.','success')}catch(e){console.error(e);showMessage(e.message||'Gagal menyimpan kategori.','error')}finally{$('saveBtn').disabled=false}}async function init(){const auth=await MandalaCMS.requireStaff();if(!auth)return;if(auth.role!=='admin'){location.replace('dashboard.html');return}await initShell('Kategori','categories');const content=document.querySelector('.content');if(!content)throw new Error('CMS shell tidak ditemukan.');content.innerHTML='<div class="page-head"><div><h1>Kategori</h1><p>Kelola kategori konten Mandala Channel.</p></div></div><div class="category-layout"><div id="formPanel"></div><div id="listPanel"></div></div>';$('formPanel').innerHTML=formHtml();$('listPanel').innerHTML=listHtml();$('categoryForm').onsubmit=save;$('cancelBtn').onclick=resetForm;$('categoryName').addEventListener('input',()=>{if(!$('categorySlug').dataset.manual)$('categorySlug').value=slugify($('categoryName').value)});$('categorySlug').addEventListener('input',()=>{$('categorySlug').dataset.manual='1'});try{await refresh()}catch(e){console.error(e);showMessage(e.message||'Gagal memuat kategori.','error')}}document.addEventListener('DOMContentLoaded',()=>init().catch(e=>console.error(e)));</script></body></html>
