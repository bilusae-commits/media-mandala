<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kategori — Mandala Channel CMS</title><link rel="stylesheet" href="css/cms.css?v=20260901-7"><script src="../js/config.js?v=20260901-7"></script><script src="../js/supabase-client.js?v=20260901-7"></script><script src="js/cms-service.js?v=20260901-7"></script><script src="js/shell.js?v=20260901-7"></script><style>.category-layout{display:grid;grid-template-columns:minmax(300px,390px) minmax(0,1fr);gap:18px;align-items:start}.category-card{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}.category-card-head{padding:15px 18px;border-bottom:1px solid var(--border)}.category-card-head h3{margin:0;font-size:12px;font-weight:800}.category-card-head p{margin:5px 0 0;color:var(--muted);font-size:10px;line-height:1.5}.category-card-body{padding:18px}.category-field{margin-bottom:15px}.category-field:last-child{margin-bottom:0}.category-field label{display:block;margin-bottom:6px;font-size:10px;font-weight:700}.category-field input{width:100%;box-sizing:border-box;border:1px solid #d8d8d8;border-radius:7px;background:#fff;color:#222;padding:10px 11px;outline:none;font-size:11px}.category-field input:focus{border-color:#999}.category-help{margin-top:5px;color:#999;font-size:9px;line-height:1.45}.category-row{display:grid;grid-template-columns:1fr 145px;gap:12px;align-items:end}.category-check{display:flex;align-items:center;gap:8px;min-height:38px;font-size:10px;color:#555}.category-check input{width:auto}.category-actions{display:flex;gap:7px;margin-top:18px;padding-top:16px;border-top:1px solid var(--border)}.category-table-wrap{overflow-x:auto}.category-table{width:100%;min-width:620px;border-collapse:collapse}.category-table th{padding:11px 13px;background:#fafafa;border-bottom:1px solid var(--border);color:var(--muted);font-size:8px;text-align:left;text-transform:uppercase;letter-spacing:.08em}.category-table td{padding:13px;border-bottom:1px solid var(--border);font-size:11px;vertical-align:middle}.category-table tr:last-child td{border-bottom:0}.category-name{font-weight:700}.category-slug{margin-top:4px;color:var(--muted);font-size:9px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.category-order{font-variant-numeric:tabular-nums}.category-status{display:inline-flex;padding:4px 7px;border-radius:4px;font-size:8px;font-weight:700}.category-status.active{background:#f0fdf4;color:var(--green)}.category-status.inactive{background:#f3f4f6;color:#6b7280}.category-actions-cell{display:flex;flex-wrap:wrap;gap:5px}.category-action{padding:6px 8px;border:1px solid var(--border);border-radius:5px;background:#fff;color:#333;font-size:9px;cursor:pointer}.category-action:hover{background:#fafafa}.category-action.danger{color:var(--red)}.category-message{display:none;margin-bottom:14px;padding:10px 12px;border-radius:7px;background:#f5f7fa;color:#59636e;font-size:10px;line-height:1.5}.category-message.show{display:block}.category-message.error{background:#fff1f1;color:var(--red)}.category-message.success{background:#f0fdf4;color:var(--green)}.category-list-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.category-count{color:var(--muted);font-size:10px}.category-empty{padding:50px 20px;text-align:center;color:var(--muted);font-size:11px}.category-empty strong{display:block;margin-bottom:6px;color:#222;font-size:14px}@media(max-width:950px){.category-layout{grid-template-columns:1fr}.category-row{grid-template-columns:1fr 145px}}@media(max-width:600px){.category-row{grid-template-columns:1fr}.category-card-body{padding:15px}.category-table{min-width:570px}}</style></head><body><script>'use strict';let categories=[];const $=id=>document.getElementById(id);const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');const slugify=v=>String(v||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');function showMessage(text,type=''){const x=$('categoryMessage');if(!x)return;x.textContent=text;x.className='category-message show '+type}function resetForm(){ $('categoryId').value='';$('categoryName').value='';$('categorySlug').value='';$('categoryOrder').value='0';$('categoryActive').checked=true;$('categorySlug').dataset.manual='';$('formTitle').textContent='Tambah Kategori';$('formDesc').textContent='Buat kategori baru untuk mengelompokkan artikel, video, dan podcast.';$('saveBtn').textContent='Simpan Kategori';$('cancelBtn').style.display='none';showMessage('')}function formHtml(){return '<section class="category-card"><div class="category-card-head"><h3 id="formTitle">Tambah Kategori</h3><p id="formDesc">Buat kategori baru untuk mengelompokkan artikel, video, dan podcast.</p></div><div class="category-card-body"><div id="categoryMessage" class="category-message"></div><form id="categoryForm"><input type="hidden" id="categoryId"><div class="category-field"><label for="categoryName">Nama kategori</label><input id="categoryName" maxlength="100" required placeholder="Contoh: Tokoh Hindu"><div class="category-help">Nama yang akan terlihat di panel admin dan halaman publik.</div></div><div class="category-field"><label for="categorySlug">Slug</label><input id="categorySlug" maxlength="120" required placeholder="tokoh-hindu"><div class="category-help">Gunakan huruf kecil dan tanda hubung. Slug dibuat otomatis dari nama.</div></div><div class="category-row"><div class="category-field"><label for="categoryOrder">Urutan</label><input id="categoryOrder" type="number" min="0" value="0"></div><label class="category-check"><input id="categoryActive" type="checkbox" checked> Kategori aktif</label></div><div class="category-actions"><button class="btn btn-primary" id="saveBtn" type="submit">Simpan Kategori</button><button class="btn btn-light" id="cancelBtn" type="button" style="display:none">Batal</button></div></form></div></section>'}function listHtml(){return '<section class="category-card"><div class="category-card-head"><div class="category-list-head"><div><h3>Daftar Kategori</h3><p>Kategori yang tersedia untuk konten Mandala Channel.</p></div><span class="category-count">'+categories.length+' kategori</span></div></div><div class="category-table-wrap">'+(categories.length?'<table class="category-table"><thead><tr><th>Kategori</th><th>Urutan</th><th>Status</th><th>Aksi</th></tr></thead><tbody>'+categories.map(c=>'<tr><td><div class="category-name">'+esc(c.name)+'</div><div class="category-slug">'+esc(c.slug||'—')+'</div></td><td class="category-order">'+Number(c.sort_order||0)+'</td><td><span class="category-status '+(c.is_active!==false?'active':'inactive')+'">'+(c.is_active!==false?'Aktif':'Nonaktif')+'</span></td><td><div class="category-actions-cell"><button class="category-action" data-edit="'+esc(c.id)+'">Edit</button><button class="category-action" data-toggle="'+esc(c.id)+'">'+(c.is_active!==false?'Nonaktifkan':'Aktifkan')+'</button><button class="category-action danger" data-delete="'+esc(c.id)+'">Hapus</button></div></td></tr>').join('')+'</tbody></table>':'<div class="category-empty"><strong>Belum ada kategori</strong>Tambahkan kategori pertama melalui formulir di sebelah kiri.</div>')+'</div></section>'}function edit(id){const c=categories.find(x=>x.id===id);if(!c)return;$('categoryId').value=c.id;$('categoryName').value=c.name||'';$('categorySlug').value=c.slug||'';$('categorySlug').dataset.manual='1';$('categoryOrder').value=c.sort_order||0;$('categoryActive').checked=c.is_active!==false;$('formTitle').textContent='Edit Kategori';$('formDesc').textContent='Perbarui informasi kategori tanpa mengubah konten yang sudah menggunakannya.';$('saveBtn').textContent='Simpan Perubahan';$('cancelBtn').style.display='inline-flex';showMessage('');window.scrollTo({top:0,behavior:'smooth'})}function bindList(){document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{const c=categories.find(x=>x.id===b.dataset.toggle);if(!c)return;try{await MandalaCMS.update('categories',c.id,{is_active:c.is_active===false,updated_at:new Date().toISOString()});await refresh();showMessage('Status kategori diperbarui.','success')}catch(e){console.error(e);showMessage(e.message||'Gagal mengubah status kategori.','error')}});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{const c=categories.find(x=>x.id===b.dataset.delete);if(!c||!confirm('Hapus kategori "'+c.name+'"?'))return;try{const rows=await MandalaCMS.select('articles','id,category_id');if(rows.some(a=>a.category_id===c.id)){showMessage('Kategori masih digunakan oleh artikel. Nonaktifkan kategori ini agar artikel tetap aman.','error');return}await MandalaCMS.remove('categories',c.id);resetForm();await refresh();showMessage('Kategori berhasil dihapus.','success')}catch(e){console.error(e);showMessage(e.message||'Gagal menghapus kategori.','error')}})}function renderList(){const x=$('listPanel');if(x){x.innerHTML=listHtml();bindList()}}async function refresh(){categories=await MandalaCMS.categories();renderList()}async function save(e){e.preventDefault();const id=$('categoryId').value,name=$('categoryName').value.trim(),slug=slugify($('categorySlug').value||name),sort_order=Math.max(0,Number($('categoryOrder').value||0)),is_active=$('categoryActive').checked;if(!name||!slug)return showMessage('Nama dan slug wajib diisi.','error');if(categories.some(c=>c.slug===slug&&c.id!==id))return showMessage('Slug sudah digunakan kategori lain.','error');try{$('saveBtn').disabled=true;const payload={name,slug,sort_order,is_active,updated_at:new Date().toISOString()};if(id)await MandalaCMS.update('categories',id,payload);else await MandalaCMS.insert('categories',payload);resetForm();await refresh();showMessage(id?'Kategori berhasil diperbarui.':'Kategori berhasil ditambahkan.','success')}catch(e){console.error(e);showMessage(e.message||'Gagal menyimpan kategori.','error')}finally{$('saveBtn').disabled=false}}async function init(){const auth=await MandalaCMS.requireStaff();if(!auth)return;if(auth.role!=='admin'){location.replace('dashboard.html');return}await initShell('Kategori','categories');const content=document.querySelector('.content');if(!content)throw new Error('CMS shell tidak ditemukan.');content.innerHTML='<div class="page-head"><div><h1>Kategori</h1><p>Kelola kategori konten Mandala Channel.</p></div><div></div></div><div class="category-layout"><div id="formPanel"></div><div id="listPanel"></div></div>';$('formPanel').innerHTML=formHtml();$('listPanel').innerHTML=listHtml();$('categoryForm').onsubmit=save;$('cancelBtn').onclick=resetForm;$('categoryName').addEventListener('input',()=>{if(!$('categorySlug').dataset.manual)$('categorySlug').value=slugify($('categoryName').value)});$('categorySlug').addEventListener('input',()=>{$('categorySlug').dataset.manual='1'});try{await refresh()}catch(e){console.error(e);showMessage(e.message||'Gagal memuat kategori.','error')}}document.addEventListener('DOMContentLoaded',()=>init().catch(e=>{console.error(e)}));</script></body></html>
