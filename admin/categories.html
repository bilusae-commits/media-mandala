<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kategori — Mandala Channel CMS</title>
<link rel="stylesheet" href="css/cms.css?v=20260901-10">
<script src="../js/config.js?v=20260901-10"></script>
<script src="../js/supabase-client.js?v=20260901-10"></script>
<script src="js/cms-service.js?v=20260901-10"></script>
<script src="js/shell.js?v=20260901-10"></script>
</head>
<body>
<script>
'use strict';
let categories=[];
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const slugify=v=>String(v||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
function message(text,type=''){const x=$('message');if(!x)return;x.textContent=text;x.className='message'+(type?' '+type:'');}
function resetForm(){
 $('categoryId').value='';$('name').value='';$('slug').value='';$('sortOrder').value='0';$('active').checked=true;
 $('slug').dataset.manual='';$('formTitle').textContent='Tambah Kategori';$('saveBtn').textContent='Simpan Kategori';$('cancelBtn').style.display='none';message('');
}
function formHtml(){return `
<div class="card">
 <div class="field"><label id="formTitle">Tambah Kategori</label><div class="help">Buat kategori untuk mengelompokkan artikel, video, dan podcast.</div></div>
 <div id="message" class="message"></div>
 <form id="categoryForm">
  <input type="hidden" id="categoryId">
  <div class="field"><label for="name">Nama kategori</label><input class="input" id="name" maxlength="100" required placeholder="Contoh: Tokoh Hindu"><div class="help">Nama yang tampil pada konten dan panel admin.</div></div>
  <div class="field"><label for="slug">Slug</label><input class="input" id="slug" maxlength="120" required placeholder="tokoh-hindu"><div class="help">Gunakan huruf kecil dan tanda hubung.</div></div>
  <div class="form-grid">
   <div class="field"><label for="sortOrder">Urutan</label><input class="input" id="sortOrder" type="number" min="0" value="0"></div>
   <div class="field"><label>Status</label><label class="check"><input id="active" type="checkbox" checked> Aktif</label></div>
  </div>
  <div class="form-actions"><button class="btn btn-primary" id="saveBtn" type="submit">Simpan Kategori</button><button class="btn btn-light" id="cancelBtn" type="button" style="display:none">Batal</button></div>
 </form>
</div>`}
function listHtml(){return `
<div class="panel">
 <div class="panel-head"><div><div class="panel-title">Daftar Kategori</div><div class="panel-meta">${categories.length} kategori</div></div></div>
 <div class="table-wrap">${categories.length?`<table class="table" style="min-width:650px"><thead><tr><th>Kategori</th><th>Urutan</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${categories.map(c=>`<tr><td><div class="video-name">${esc(c.name)}</div><div class="video-sub">${esc(c.slug||'—')}</div></td><td>${Number(c.sort_order||0)}</td><td><span class="badge ${c.is_active!==false?'badge-published':'badge-archived'}">${c.is_active!==false?'Aktif':'Nonaktif'}</span></td><td><div class="actions"><button class="action" data-edit="${esc(c.id)}">Edit</button><button class="action" data-toggle="${esc(c.id)}">${c.is_active!==false?'Nonaktifkan':'Aktifkan'}</button><button class="action danger" data-delete="${esc(c.id)}">Hapus</button></div></td></tr>`).join('')}</tbody></table>`:`<div class="empty"><strong>Belum ada kategori</strong>Tambahkan kategori pertama melalui formulir di sebelah kiri.</div>`}</div>
</div>`}
function edit(id){const c=categories.find(x=>x.id===id);if(!c)return;$('categoryId').value=c.id;$('name').value=c.name||'';$('slug').value=c.slug||'';$('slug').dataset.manual='1';$('sortOrder').value=c.sort_order||0;$('active').checked=c.is_active!==false;$('formTitle').textContent='Edit Kategori';$('saveBtn').textContent='Simpan Perubahan';$('cancelBtn').style.display='inline-flex';message('');window.scrollTo({top:0,behavior:'smooth'});}
function bindList(){
 document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));
 document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{const c=categories.find(x=>x.id===b.dataset.toggle);if(!c)return;try{await MandalaCMS.update('categories',c.id,{is_active:c.is_active===false,updated_at:new Date().toISOString()});await refresh();message('Status kategori diperbarui.','success');}catch(e){console.error(e);message(e.message||'Gagal mengubah status kategori.','error');}});
 document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{const c=categories.find(x=>x.id===b.dataset.delete);if(!c||!confirm('Hapus kategori "'+c.name+'"?'))return;try{const rows=await MandalaCMS.select('articles','id,category_id');if(rows.some(a=>a.category_id===c.id)){message('Kategori masih digunakan oleh artikel. Nonaktifkan kategori ini agar artikel tetap aman.','error');return;}await MandalaCMS.remove('categories',c.id);resetForm();await refresh();message('Kategori berhasil dihapus.','success');}catch(e){console.error(e);message(e.message||'Gagal menghapus kategori.','error');}});
}
function render(){const x=$('listPanel');if(x){x.innerHTML=listHtml();bindList();}}
async function refresh(){categories=await MandalaCMS.categories();render();}
async function save(e){e.preventDefault();const id=$('categoryId').value,name=$('name').value.trim(),slug=slugify($('slug').value||name),sort_order=Math.max(0,Number($('sortOrder').value||0)),is_active=$('active').checked;if(!name||!slug){message('Nama dan slug wajib diisi.','error');return;}if(categories.some(c=>c.slug===slug&&c.id!==id)){message('Slug sudah digunakan kategori lain.','error');return;}try{$('saveBtn').disabled=true;const payload={name,slug,sort_order,is_active,updated_at:new Date().toISOString()};if(id)await MandalaCMS.update('categories',id,payload);else await MandalaCMS.insert('categories',payload);resetForm();await refresh();message(id?'Kategori berhasil diperbarui.':'Kategori berhasil ditambahkan.','success');}catch(e){console.error(e);message(e.message||'Gagal menyimpan kategori.','error');}finally{$('saveBtn').disabled=false;}}
async function init(){
 const auth=await MandalaCMS.requireStaff();if(!auth)return;if(auth.role!=='admin'){location.replace('dashboard.html');return;}
 await initShell('Kategori','categories');
 const content=document.querySelector('.content');if(!content)throw new Error('CMS shell tidak ditemukan.');
 content.innerHTML=`<div class="page-head"><div><h1>Kategori</h1><p>Kelola kategori konten Mandala Channel.</p></div></div><div class="editor-grid"><div id="formPanel"></div><div id="listPanel"></div></div>`;
 $('formPanel').innerHTML=formHtml();$('listPanel').innerHTML=listHtml();$('categoryForm').onsubmit=save;$('cancelBtn').onclick=resetForm;
 $('name').addEventListener('input',()=>{if(!$('slug').dataset.manual)$('slug').value=slugify($('name').value);});
 $('slug').addEventListener('input',()=>{$('slug').dataset.manual='1';});
 bindList();try{await refresh();}catch(e){console.error(e);message(e.message||'Gagal memuat kategori.','error');}
}
document.addEventListener('DOMContentLoaded',()=>init().catch(e=>console.error(e)));
</script>
</body>
</html>
