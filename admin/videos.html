<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Video — Mandala Channel CMS</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f5f5;
            color: #171717;
            font-family:
                Inter,
                system-ui,
                sans-serif;
        }

        .page {
            max-width: 1400px;
            margin: auto;
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0;
            font-size: 22px;
        }

        .subtitle {
            margin-top: 5px;
            color: #737373;
            font-size: 12px;
        }

        .btn {
            display: inline-block;
            padding: 10px 15px;
            border-radius: 7px;
            background: #171717;
            color: white;
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
        }

        .message {
            margin-bottom: 15px;
            color: #737373;
            font-size: 12px;
        }

        .card {
            overflow: hidden;
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 10px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 700px;
            border-collapse: collapse;
        }

        th {
            padding: 13px 16px;
            background: #fafafa;
            border-bottom: 1px solid #e5e5e5;
            text-align: left;
            color: #737373;
            font-size: 10px;
            text-transform: uppercase;
        }

        td {
            padding: 15px 16px;
            border-bottom: 1px solid #eee;
            font-size: 12px;
        }

        .video-title {
            font-weight: 700;
        }

        .status {
            display: inline-block;
            padding: 4px 7px;
            border-radius: 4px;
            font-size: 9px;
            font-weight: 700;
        }

        .status-draft {
            background: #f3f4f6;
            color: #4b5563;
        }

        .status-review {
            background: #fff7ed;
            color: #b45309;
        }

        .status-published {
            background: #f0fdf4;
            color: #15803d;
        }

        .status-archived {
            background: #f3f4f6;
            color: #6b7280;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .action-link,
        .action-button {
            padding: 5px 8px;
            border: 1px solid #e5e5e5;
            border-radius: 5px;
            background: white;
            color: #333;
            text-decoration: none;
            font-size: 10px;
            cursor: pointer;
        }

        .danger {
            color: #b91c1c;
        }

        .empty {
            padding: 60px 20px;
            text-align: center;
            color: #737373;
            font-size: 12px;
        }

    </style>

</head>

<body>

<main class="page">

    <div class="header">

        <div>

            <h1>
                Video
            </h1>

            <div class="subtitle">
                Kelola video Mandala Channel.
            </div>

        </div>

        <a
            class="btn"
            href="video-edit.html"
        >
            + Video Baru
        </a>

    </div>


    <div
        id="page-message"
        class="message"
    ></div>


    <section class="card">

        <div id="videos-container">

            <div class="empty">
                Memuat video...
            </div>

        </div>

    </section>

</main>


<script
    type="module"
    src="./js/videos.js"
></script>

</body>

</html>
