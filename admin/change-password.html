<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ubah Password — Mandala Channel CMS</title>
<link rel="stylesheet" href="css/cms.css?v=20260907-08">
<style>
body{visibility:visible}.security-card{max-width:620px;background:#fff;border:1px solid var(--border);border-radius:8px;overflow:hidden}.s-head{padding:15px 18px;border-bottom:1px solid var(--border)}.s-head h3{margin:0;font-size:12px}.s-head p{margin:4px 0 0;font-size:8px;color:var(--muted)}.s-body{padding:18px}.notice{font-size:8px;line-height:1.55;color:var(--muted);padding:10px 12px;background:#f7f8fa;border-left:3px solid var(--navy);margin-bottom:16px}.fields{display:grid;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.password-wrap{position:relative}.field input{box-sizing:border-box;width:100%;border:1px solid var(--border);border-radius:5px;padding:10px 62px 10px 11px;font:inherit;font-size:10px;background:#fff;outline:0}.field input:focus{border-color:var(--navy)}.password-toggle{position:absolute;right:7px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font-size:8px;font-weight:700;cursor:pointer;padding:5px}.actions{display:flex;justify-content:flex-end;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}.msg{display:none;padding:9px 11px;font-size:9px;border-radius:5px;margin-bottom:14px}.msg.show{display:block}.msg.ok{background:#f0fdf4;color:#24734f}.msg.err{background:#fff1f1;color:#9b3d3d}.recovery-page{min-height:100vh;background:#f6f7f9;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}.recovery-page .security-card{width:min(620px,100%)}@media(max-width:760px){.s-body{padding:13px}.actions{flex-direction:column}.actions .btn{width:100%}}
</style>
<script src="../js/config.js?v=20260907-08"></script>
<script src="../js/supabase-client.js?v=20260907-08"></script>
<script src="js/cms-service.js?v=20260907-08"></script>
<script src="js/shell.js?v=20260907-08"></script>
</head>
<body>
<script>
'use strict';
const $=id=>document.getElementById(id);const val=id=>$(id)?.value?.trim()||'';
function msg(text,ok=true){const e=$('msg');if(!e)return;e.textContent=text;e.className='msg show '+(ok?'ok':'err')}
function toggle(id,button){const e=$(id);if(!e)return;const show=e.type==='password';e.type=show?'text':'password';button.textContent=show?'Sembunyikan':'Tampilkan'}
function isRecovery(){return /(?:access_token|type=recovery|code=)/i.test(location.hash+location.search)}
function renderRecovery(){
 document.body.innerHTML='<div class="recovery-page"><section class="security-card"><div class="s-head"><h3>Buat Password Baru</h3><p>Gunakan tautan konfirmasi email untuk membuat password baru.</p></div><div class="s-body"><div id="msg" class="msg"></div><div class="notice">Password baru minimal <b>8 karakter</b>. Setelah berhasil, kamu akan diarahkan kembali ke halaman login.</div><div class="fields"><div class="field"><label>Password baru</label><div class="password-wrap"><input id="new_password" type="password" autocomplete="new-password" minlength="8" placeholder="Minimal 8 karakter"><button class="password-toggle" type="button" onclick="toggle('new_password',this)">Tampilkan</button></div></div><div class="field"><label>Konfirmasi password</label><div class="password-wrap"><input id="confirm_password" type="password" autocomplete="new-password" minlength="8" placeholder="Ulangi password baru"><button class="password-toggle" type="button" onclick="toggle('confirm_password',this)">Tampilkan</button></div></div></div><div class="actions"><button class="btn btn-primary" id="savePassword" type="button">Simpan Password</button></div></div></section></div>';
 $('savePassword').onclick=savePassword;
}
async function sendConfirmation(){
 const b=$('sendConfirmation');b.disabled=true;b.textContent='Mengirim…';
 try{
  const a=await MandalaCMS.getCurrentAuth();
  if(!a?.authenticated||!a.user?.email)throw new Error('Sesi akun tidak ditemukan. Silakan login kembali.');
  const db=await MandalaSupabase.getClient();
  const redirectTo=new URL('./change-password.html',location.href).href;
  const {error}=await db.auth.resetPasswordForEmail(a.user.email,{redirectTo});
  if(error)throw error;
  msg('Konfirmasi berhasil dikirim ke email '+a.user.email+'. Buka tombol/link di email tersebut untuk membuat password baru.');
  b.textContent='Email Terkirim';
  setTimeout(()=>{b.disabled=false;b.textContent='Kirim Ulang Konfirmasi'},2500);
 }catch(e){console.error(e);msg(e.message||'Gagal mengirim email konfirmasi.',false);b.disabled=false;b.textContent='Kirim Konfirmasi ke Email'}
}
async function savePassword(){
 const p=val('new_password'),c=val('confirm_password');
 if(!p)return msg('Password baru wajib diisi.',false);if(p.length<8)return msg('Password baru minimal 8 karakter.',false);if(p!==c)return msg('Konfirmasi password tidak sama.',false);
 const b=$('savePassword');b.disabled=true;b.textContent='Menyimpan…';
 try{
  const db=await MandalaSupabase.getClient();
  const {error}=await db.auth.updateUser({password:p});
  if(error)throw error;
  msg('Password berhasil diubah. Mengarahkan ke halaman login…');
  setTimeout(async()=>{try{await MandalaCMS.logout()}catch(e){location.href='login.html'}},1200);
 }catch(e){console.error(e);msg(e.message||'Gagal mengubah password.',false);b.disabled=false;b.textContent='Simpan Password'}
}
async function init(){
 if(isRecovery()){renderRecovery();return;}
 await initShell('Ubah Password','change-password');
 const a=await MandalaCMS.getCurrentAuth();
 if(!a?.authenticated)return;
 const email=a.user?.email||'alamat email akun';
 document.querySelector('.content').innerHTML='<div class="page-head"><div><h1>Ubah Password</h1><p>Perubahan password harus dikonfirmasi melalui email terlebih dahulu.</p></div></div><section class="security-card"><div class="s-head"><h3>Konfirmasi Keamanan</h3><p>Email konfirmasi akan dikirim ke '+email+'</p></div><div class="s-body"><div id="msg" class="msg"></div><div class="notice">Untuk keamanan, password <b>tidak dapat diubah langsung dari halaman ini</b>. Klik tombol di bawah untuk mengirim email konfirmasi. Setelah menerima email, buka tombol/link di dalam email tersebut untuk membuat password baru.</div><div class="actions"><button class="btn btn-primary" id="sendConfirmation" type="button">Kirim Konfirmasi ke Email</button></div></div></section>';
 $('sendConfirmation').onclick=sendConfirmation;
}
document.addEventListener('DOMContentLoaded',()=>init().catch(e=>{console.error(e);document.body.innerHTML='<div class="recovery-page"><section class="security-card"><div class="s-head"><h3>Ubah Password</h3><p>Halaman tidak dapat dimuat.</p></div><div class="s-body"><div class="msg show err">'+(e?.message||'Terjadi kesalahan saat memuat halaman.')+'</div><div class="actions"><a class="btn btn-primary" href="index.html">Kembali</a></div></div></section></div>'}));
</script>
</body>
</html>
