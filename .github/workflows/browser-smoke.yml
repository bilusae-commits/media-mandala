name: Browser smoke tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  browser-smoke:
    name: Chromium route and interaction checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start GitHub Pages base-path server
        run: |
          node scripts/serve-pages.mjs > /tmp/mandala-test-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/media-mandala/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mandala-test-server.log
          exit 1
      - name: Run browser smoke tests against repository checkout
        run: node scripts/smoke-browser.mjs
      - name: Wait for GitHub Pages deployment of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 90); do
            payload=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs?branch=main&per_page=100")
            state=$(printf '%s' "$payload" | jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.name == "pages build and deployment" and .head_sha == $sha)] | first | if . == null then "missing" else (.status + ":" + (.conclusion // "")) end')
            if [ "$state" = "completed:success" ]; then
              echo "GitHub Pages deployment for $GITHUB_SHA completed successfully."
              exit 0
            fi
            if [ "$state" = "completed:failure" ] || [ "$state" = "completed:cancelled" ]; then
              echo "GitHub Pages deployment failed: $state"
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for GitHub Pages deployment for $GITHUB_SHA."
          exit 1
      - name: Run browser smoke tests against the live website
        env:
          MANDALA_BASE_URL: https://bilusae-commits.github.io/media-mandala/
        run: node scripts/smoke-browser.mjs
