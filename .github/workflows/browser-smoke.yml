name: Browser smoke tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    name: Chromium route and interaction checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start GitHub Pages base-path server
        run: |
          node scripts/serve-pages.mjs > /tmp/mandala-test-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/media-mandala/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mandala-test-server.log
          exit 1
      - name: Run browser smoke tests
        run: node scripts/smoke-browser.mjs
